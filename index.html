/* ---------- חיבור לפונקציית המאמן ב Supabase ---------- */
function coachErrText(e) {
  const m = String(e?.message || e || '');
  if (e?.status === 404 || /not found|Function not found/i.test(m)) return 'פונקציית המאמן עוד לא הועלתה ל Supabase. ההוראות בקובץ README';
  if (/OPENAI_API_KEY/.test(m)) return 'חסר המפתח של OpenAI בסודות של Supabase';
  if (e?.status === 401 || /JWT|לא מחובר/i.test(m)) return 'הפונקציה דחתה את ההתחברות. בהגדרות הפונקציה כבה את Verify JWT';
  if (/offline|Failed to fetch|NetworkError/i.test(m)) return 'אין חיבור לרשת';
  return m.slice(0, 220) || 'שגיאה לא ידועה';
}
async function coachCall(action, body = {}) {
  if (!navigator.onLine) throw new Error('offline');
  const { data, error } = await sb.functions.invoke('coach', { body: { action, today: today(), ...body } });
  if (error) {
    let msg = error.message, status = error.context?.status;
    try { const j = await error.context.json(); msg = j.error || msg; } catch (x) {}
    const err = new Error(msg); err.status = status; throw err;
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}
function coachMigrate() {

  const absWas = S.settings.minSets.abs;

}

    const [p, msg] = await Promise.all([

      sb.from('coach_messages').select('*').order('created_at', { ascending: false }).limit(60)
    ]);
    const e = p.error || msg.error;
    if (e) { S.coach.tables = false; log('המאמן: הטבלאות עוד לא קיימות או לא נגישות', errInfo(e)); render(); return; }
    S.coach.tables = true; S.coach.plan = p.data || null; S.coach.msgs = (msg.data || []).reverse();
    coachSave(); render(); coachAutoPlan();

}

});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  const email = $('#lemail').value.trim(), password = $('#lpass').value, btn = $('#lbtn'), err = $('#lerr');
  if (!email || !password) { err.textContent = 'הזן אימייל וסיסמה'; return; }
  btn.disabled = true; btn.textContent = 'נכנס'; err.textContent = '';
  log('ניסיון כניסה:', email, '| אורך סיסמה', password.length);
  let error;
  try { ({ error } = await sb.auth.signInWithPassword({ email, password })); }
  catch (ex) { error = ex; }
  if (error) log('הכניסה נכשלה:', errInfo(error)); else log('הכניסה הצליחה');
  if (error) { err.textContent = /invalid login/i.test(error.message) ? 'האימייל או הסיסמה שגויים' : (error.message || 'שגיאה לא ידועה') + (error.status ? ` (${error.status})` : ''); btn.disabled = false; btn.textContent = 'כניסה'; }
});
/* ---------- באג המקלדת באייפון: הסרגל התחתון נתקע באמצע המסך ---------- */
const isEditable = el => !!el && ((el.tagName === 'INPUT' && !el.readOnly && !['checkbox', 'radio', 'file', 'button', 'submit'].includes(el.type)) || el.tagName === 'TEXTAREA');
function settleViewport() {
  if (isEditable(document.activeElement)) return;
  document.body.classList.remove('kb');
  const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  if (window.scrollY > max) window.scrollTo(0, max);
  ['.nav', '#tb', '#sync'].forEach(sel => { const el = $(sel); if (!el) return; const d = el.style.display; el.style.display = 'none'; void el.offsetHeight; el.style.display = d; });
}
document.addEventListener('focusin', e => { if (isEditable(e.target)) document.body.classList.add('kb'); });
document.addEventListener('focusout', e => {
  const t = e.target;
  const wasTyping = isEditable(t);
  if (t && t.dataset && t.dataset.tapedit) { t.readOnly = true; syncChips(t); }
  if (wasTyping) { setTimeout(settleViewport, 80); setTimeout(settleViewport, 400); }
});
if (window.visualViewport) {
  let vvT = null;
  visualViewport.addEventListener('resize', () => { clearTimeout(vvT); vvT = setTimeout(() => { if (visualViewport.height > window.innerHeight * 0.85) settleViewport(); }, 120); });
}
window.addEventListener('orientationchange', () => setTimeout(settleViewport, 300));
window.addEventListener('pageshow', () => { settleViewport(); if (S.user) flush(); });
document.addEventListener('pointerdown', primeAudio, { passive: true });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#drawer').hidden) closeDrawer(); else if (!$('#modal').hidden) closeModal(); else if (!$('#tf').hidden) $('#tf').hidden = true; }
  if (e.key === 'Enter' && e.target.classList?.contains('sinput')) e.target.blur();
});
window.addEventListener('hashchange', () => { closeDrawer(true); S.prevHash = S.curHash; S.curHash = location.hash; render(); window.scrollTo(0, 0); document.body.classList.remove('scrolled'); });
window.addEventListener('scroll', () => { document.body.classList.toggle('scrolled', window.scrollY > 36); }, { passive: true });
window.addEventListener('online', () => { updateSync(); flush(); });
window.addEventListener('offline', updateSync);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { try { if (actx && actx.state !== 'running') actx.resume(); } catch (e) {} settleViewport(); updateWakeLock(); tick(); flush(); if (S.user) fetchAll(); }
  else updateWakeLock();
});
setInterval(tick, 250);
setInterval(() => { if (S.queue.length) flush(); }, 20000);

async function requestPersist() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return;
    S.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
    log('אחסון קבוע:', S.persisted ? 'פעיל' : 'לא אושר');
    updateSync();
  } catch (e) {}
}
/* פתיחה מחדש באמצע אימון: חוזרים למכשיר שבו היית */
let resumed = false;
function maybeResume() {
  if (resumed || !S.loaded) return; resumed = true;
  const h = location.hash; if (h && h !== '#/' && h !== '#') return;
  const r = resumeTarget(); if (!r) return;
  history.replaceState(null, '', r); S.curHash = r; log('ממשיך מאיפה שעצרת:', r);
}
/* ---------- boot ---------- */
(function boot() {
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').then(() => log('אפליקציה במסך הבית: מוכנה לעבודה בלי רשת')).catch(e => log('רישום SW נכשל:', e.message));
  }
  log('גרסה', APP_VERSION, '| דפדפן:', navigator.userAgent);
  log('כתובת בקובץ:', CONFIG.SUPABASE_URL, SB_URL !== CONFIG.SUPABASE_URL ? '=> תוקנה ל ' + SB_URL : '(תקינה)');
  log('מפתח:', SB_KEY.slice(0, 18) + '…', 'אורך', SB_KEY.length, SB_KEY.startsWith('sb_publishable_') ? '(publishable, תקין)' : SB_KEY.startsWith('sb_secret_') ? '(סודי! אסור בדפדפן)' : SB_KEY.startsWith('eyJ') ? '(מפתח anon ישן)' : '(סוג לא מוכר)');
  log('ספריית Supabase נטענה:', !!window.supabase, '| מחובר לרשת:', navigator.onLine);
  if (!configured || !window.supabase) {
    render();
    if (configured && !window.supabase) $('#app').innerHTML = '<div class="empty" style="padding-top:30vh">טעינת הספרייה נכשלה. בדוק חיבור לאינטרנט ורענן.</div>';
    return;
  }
  sb = window.supabase.createClient(SB_URL, SB_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'koach-auth' }
  });
  sb.auth.onAuthStateChange((event, session) => {
    const u = session?.user || null;
    log('אירוע התחברות:', event, u ? 'משתמש ' + u.email : 'אין משתמש');
    if (u && (!S.user || S.user.id !== u.id)) {
      S.user = u; loadCache(); maybeResume(); render(); requestPersist();
      setTimeout(() => { flush(); fetchAll(); }, 0);
    } else if (!u && S.user) {
      S.user = null; resetState(); render();
    } else if (!u) {
      render();
    }
  });
})();
</script>
