<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="כוח">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<title>כוח</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --a-back:#5856D6; --a-biceps:#FF2D55; --a-chest:#FF3B30; --a-triceps:#AF52DE;
  --a-shoulders:#FF9500; --a-legs:#34C759; --a-abs:#00B5AD;
  --accent:#007AFF; --accent-text:#0062CC; --accent-tint:rgba(0,122,255,.12); --on-accent:#FFFFFF;
  --bg:#F2F2F7; --surface:#FFFFFF; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.22);
  --sep:rgba(60,60,67,.18); --text:#1C1C1E; --muted:#6C6C70; --faint:#AEAEB2;
  --ok:#1E7B34; --okfill:#34C759; --ok-tint:rgba(52,199,89,.16);
  --warn:#A84B00; --warn-tint:rgba(255,149,0,.16);
  --danger:#D70015; --danger-tint:rgba(255,59,48,.12);
  --note-bg:#FFF4D6; --note:#6B4E00;
  --r-card:24px; --nav-h:68px;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Segoe UI","Noto Sans Hebrew",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
#app{max-width:600px;margin:0 auto;padding:0 18px calc(var(--nav-h) + 140px + var(--sb))}
button,input,select,textarea{font:inherit;color:inherit}
button,a,label{touch-action:manipulation}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:16px}
.sm{font-size:15px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:10px}
.hidden{display:none!important}
.center{align-self:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* navigation bar + large title */
.navbar{position:sticky;top:0;z-index:12;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:calc(52px + var(--st));padding:var(--st) 8px 0;margin:0 -18px;transition:background-color .2s,box-shadow .2s}
body.scrolled .navbar{background:rgba(242,242,247,.84);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nb-side{display:flex;align-items:center;min-width:0}
.nb-end{justify-content:flex-end}
.nb-title{font-size:18px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;text-align:center}
body.scrolled .nb-title{opacity:1}
.nb-back{display:inline-flex;align-items:center;gap:0;min-height:48px;padding:0 4px;color:var(--accent);text-decoration:none;font-size:18px;white-space:nowrap}
.nb-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--accent);text-decoration:none;background:transparent;border:0}
.nb-timer{display:inline-flex;align-items:center;gap:6px;padding:0 10px;font-size:19px;font-weight:600;color:var(--text)}
.arrows{display:inline-flex}
.large{padding:0 2px;margin-bottom:16px}
.large h1{margin:0;font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-.3px}
.large h1.sm{font-size:30px}
.lsub{font-size:16px;font-weight:600;color:var(--muted)}
.iconbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--accent);flex-shrink:0;text-decoration:none}
.navbar .iconbtn{background:transparent}

.h2{font-size:30px;font-weight:800;line-height:1.1}
.h3{font-size:20px;font-weight:700}
.section-title,.group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 6px 10px;font-size:21px;font-weight:700}
.group-head{justify-content:flex-start}
.section-title a,.link{font-size:17px;font-weight:500;color:var(--accent-text);background:none;border:0;padding:8px 4px;min-height:44px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.gh-v{display:inline-flex;align-items:center;gap:4px;font-size:19px;color:var(--muted);font-weight:600}
.gh-v.met{color:var(--ok)}

.card{background:var(--surface);border-radius:var(--r-card);padding:20px}
.card + .card{margin-top:14px}
.stack > .card + .card,.stack-sm > .card + .card{margin-top:0}

.btn{min-height:58px;border-radius:999px;border:0;padding:0 24px;font-size:19px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:transform .1s,opacity .1s;-webkit-user-select:none;user-select:none;position:relative}
.btn:active{transform:scale(.97);opacity:.85}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-tinted{background:var(--accent-tint);color:var(--accent-text)}
.btn-ghost{background:var(--surface);color:var(--text)}
.card .btn-ghost,.sheet .btn-ghost,.btn-gray{background:var(--fill);color:var(--text)}
.btn-danger{background:var(--danger-tint);color:var(--danger)}
.btn-block{width:100%}
.btn-big{min-height:66px;font-size:21px;font-weight:700}
.btn-sm{min-height:46px;padding:0 18px;font-size:17px}
.btn[disabled]{opacity:.5}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:15px;font-weight:600;padding:5px 12px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.neutral{background:var(--fill);color:var(--muted)}
.note{background:var(--note-bg);color:var(--note);border-radius:16px;padding:12px 16px;font-size:17px;margin-bottom:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 8px;margin:0 -18px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-size:17px;text-decoration:none;color:var(--text);flex-shrink:0}
.chip.on{background:var(--accent);color:#fff;font-weight:600}
.chip.on .dot{box-shadow:0 0 0 2px #fff}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;display:inline-block}
.bar{height:8px;border-radius:4px;background:var(--fill2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .3s}
.group-head + .bar{margin:0 6px 12px}

/* tab bar */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--sb));padding-bottom:var(--sb);background:rgba(249,249,251,.88);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);display:flex;z-index:20}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7C7C80;text-decoration:none;font-size:12px;font-weight:600}
.nav a svg{width:30px;height:30px}
.nav a.on{color:var(--accent)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin:0 0 16px;background:var(--surface);border-radius:var(--r-card);padding:14px 6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:600}
.wd .c{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--faint);font-family:var(--round)}
.wd.plan .c{background:var(--fill);color:var(--text)}
.wd.done .c{background:var(--c,var(--accent));color:#fff}
.wd.today{color:var(--accent)}
.wd.today .c{box-shadow:inset 0 0 0 2.5px var(--accent);color:var(--accent)}
.wd.today.done .c{box-shadow:inset 0 0 0 2.5px #fff,0 0 0 2.5px var(--c,var(--accent));color:#fff}
.wd .rd{width:6px;height:6px;border-radius:50%}
.wd .rd.on{background:var(--a-shoulders)}

/* today */
.today-card{display:flex;flex-direction:column;gap:20px}
.tc-head{display:flex;align-items:flex-start;gap:12px}
.tc-body{display:flex;align-items:center;gap:22px}
.rings{flex-shrink:0;display:block}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.legend li{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.lv{font-size:26px;font-weight:700;line-height:1}
.lv small{font-size:16px;color:var(--muted);font-weight:600}
.lv.met{color:var(--ok)}
.ride-card{display:flex;align-items:center;gap:14px}
.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;background:var(--c,var(--accent));color:#fff}
.ap{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:12px;font-size:18px;font-weight:600}
.ap .v{text-align:left;font-weight:700;font-family:var(--round)}
.ap .v.ok{color:var(--ok)}

/* lists */
.list{background:var(--surface);border-radius:20px;overflow:hidden}
.lrow,.srow2{position:relative}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:72px;text-decoration:none;color:var(--text);border:0;background:transparent;width:100%;text-align:right}
.lrow:active{background:var(--fill)}
.list .lrow + .lrow::before,.list .srow2 + .srow2::before{content:"";position:absolute;top:0;left:0;right:16px;height:.5px;background:var(--sep)}
.list .lrow + .lrow:has(.thumb)::before,.list .lrow + .lrow:has(.day-badge)::before,.list .lrow + .lrow:has(.ic)::before{right:86px}
.lrow .t{font-size:18px;font-weight:600}
.thumb{width:56px;height:56px;border-radius:14px;background:var(--fill);flex-shrink:0;overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.chev{color:#C4C4C7;flex-shrink:0;display:flex}
.done-ck{width:32px;height:32px;border-radius:50%;background:var(--okfill);color:#fff;display:grid;place-items:center;flex-shrink:0}
.cnt{font-size:17px;font-weight:700;color:var(--accent-text);background:var(--accent-tint);border-radius:999px;padding:4px 12px;flex-shrink:0}
.lrow.is-done .t{color:var(--muted)}
.add-row{color:var(--accent-text);font-weight:600;min-height:64px}

/* machine picker */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mcard{background:var(--surface);border-radius:20px;overflow:hidden;text-decoration:none;color:var(--text);display:flex;flex-direction:column}
.mcard.done{opacity:.55}
.mphoto{position:relative;aspect-ratio:4/3;background:var(--fill);display:grid;place-items:center;color:var(--muted)}
.mphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mphoto .badge{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92);color:var(--ok);font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px}
.mbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.mname{font-size:18px;font-weight:700;line-height:1.25}

/* logging */
.hero{width:100%;height:210px;border-radius:var(--r-card);overflow:hidden;background:var(--fill);margin-bottom:14px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.prev{background:var(--surface);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.prev-sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ps{background:var(--fill);border-radius:999px;padding:6px 14px;font-size:19px;font-weight:700}
.first{margin:0 4px 14px}
.sets-list{margin-bottom:14px}
.setrow{min-height:66px}
.setrow .n{width:58px;color:var(--muted);font-size:17px;font-weight:600}
.setrow .w{font-size:27px;font-weight:700}
.setcard{display:flex;flex-direction:column;gap:20px}
.sc-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.stepper{display:flex;flex-direction:column;gap:6px}
.slabel{font-size:16px;font-weight:600;color:var(--muted);text-align:center}
.srow{display:flex;align-items:center;gap:12px}
.sbtn{width:72px;height:72px;border-radius:50%;border:0;background:var(--fill);color:var(--accent);display:grid;place-items:center;flex-shrink:0;transition:transform .1s}
.sbtn:active{transform:scale(.92);background:var(--fill2)}
.sinput{flex:1;min-width:0;height:78px;text-align:center;font-size:60px;font-weight:700;background:transparent;border:0;border-radius:18px;padding:0;color:var(--text)}
.sinput:focus{outline:none;background:var(--accent-tint)}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:16px}

/* forms */
.field{display:flex;flex-direction:column;gap:8px}
.field label,.flabel{font-size:16px;font-weight:600;color:var(--muted);padding-inline:4px}
.input{height:58px;border:0;border-radius:16px;background:var(--surface);padding:0 16px;font-size:19px;width:100%}
.card .input,.sheet .input{background:var(--fill)}
.input:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent)}
.input::placeholder{color:var(--faint);opacity:1}
.big-input{height:72px;font-size:34px;font-weight:700;text-align:left;font-family:var(--round)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.photobox{height:230px;border-radius:var(--r-card);background:var(--surface);overflow:hidden;display:grid;place-items:center;color:var(--faint)}
.photobox img{width:100%;height:100%;object-fit:cover;display:block}
.seg{display:flex;gap:2px;background:var(--fill2);border-radius:14px;padding:3px}
.seg button{flex:1;min-height:48px;border-radius:11px;border:0;background:transparent;font-size:18px;font-weight:600}
.seg button.on{background:var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.mini{display:flex;align-items:center;gap:8px}
.mini button{width:48px;height:48px;border-radius:50%;border:0;background:var(--fill);color:var(--accent);display:grid;place-items:center}
.mini .val{min-width:64px;text-align:center;font-size:21px;font-weight:700}
.mini .input{background:var(--surface)}
.srow2{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;font-size:18px}
select.input{appearance:none;-webkit-appearance:none;height:46px;width:auto;min-width:130px;font-size:18px;padding:0 14px;background:var(--fill);color:var(--accent-text);font-weight:600}
.toggle{position:relative;width:56px;height:34px;flex-shrink:0}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:17px;background:var(--fill2);transition:background .2s}
.toggle span::after{content:"";position:absolute;top:2px;right:2px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.toggle input:checked + span{background:var(--okfill)}
.toggle input:checked + span::after{transform:translateX(-22px)}
.toggle input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}

/* rest timer */
.tb{position:fixed;z-index:30;bottom:calc(var(--nav-h) + var(--sb) + 12px);left:50%;transform:translateX(-50%);width:min(564px,calc(100% - 24px));height:86px;border-radius:30px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--text);display:flex;align-items:center;gap:8px;padding:0 12px;box-shadow:0 10px 30px rgba(0,0,0,.14),0 0 0 .5px var(--sep)}
.tb[hidden]{display:none}
.tb-main{flex:1;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:inherit;min-height:64px;text-align:right;padding:0}
.tb .ring{color:var(--accent)}
.ring .trk{fill:none;stroke:currentColor;opacity:.16}
.ring .prg{fill:none;stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.tb-txt{display:flex;flex-direction:column;line-height:1.05}
.tb-lbl{font-size:15px;color:var(--muted);font-weight:600}
.tb-time{font-size:34px;font-weight:700;font-family:var(--round)}
.tb-btn{min-width:56px;height:56px;border-radius:999px;border:0;background:var(--fill);color:var(--accent-text);font-size:17px;font-weight:700;padding:0 12px}
.tb.done{background:var(--okfill);color:#fff}
.tb.done .ring,.tb.done .tb-lbl{color:#fff}
.tb.done .tb-btn{background:rgba(255,255,255,.25);color:#fff}
.tf{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;padding:calc(var(--st) + 12px) 20px calc(var(--sb) + 24px)}
.tf[hidden]{display:none}
.tf-top{align-self:stretch;display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:600}
.tf-top .iconbtn{color:var(--muted)}
.tf-lbl{font-size:22px;font-weight:600;color:var(--muted);margin-top:4vh}
.tf-ring{position:relative;width:min(320px,80vw);aspect-ratio:1;margin-top:3vh;display:grid;place-items:center;color:var(--accent)}
.tf-ring svg{position:absolute;inset:0;width:100%;height:100%}
.tf-time{font-size:min(104px,26vw);font-weight:700;line-height:1;font-family:var(--round)}
.tf-btns{display:flex;gap:14px;margin-top:32px}
.tf-btns button{width:112px;height:68px;border-radius:999px;border:0;background:var(--surface);color:var(--accent-text);font-size:24px;font-weight:700}
.tf.done .tf-ring{color:var(--okfill)}
.tf.done .tf-time{color:var(--ok)}

/* sheet, toast, sync */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:28px 28px 0 0;padding:10px 20px calc(var(--sb) + 22px);max-height:90vh;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 14px}
.sheet h2{margin:0 0 16px;font-size:26px;font-weight:800}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;z-index:70;top:calc(var(--st) + 14px);left:50%;transform:translateX(-50%) translateY(-24px);background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--text);padding:14px 22px;border-radius:999px;font-size:17px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.16);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sync{position:fixed;z-index:25;bottom:calc(var(--nav-h) + var(--sb) + 10px);left:50%;transform:translateX(-50%);font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;background:#FFF1DE;color:var(--warn);box-shadow:0 4px 14px rgba(0,0,0,.08)}
body.has-timer .sync{bottom:calc(var(--nav-h) + var(--sb) + 108px)}
.sync[hidden]{display:none}

.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:calc(var(--st) + 24px) 0 40px}
.app-icon{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 26px rgba(0,98,204,.28);margin-bottom:10px}
.brand{font-size:56px;font-weight:800;line-height:1}
.err{color:var(--danger);font-size:16px;min-height:22px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .btn{margin-top:14px}
.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.stat .k{font-size:15px;color:var(--muted);font-weight:600}
.stat .v{font-size:28px;font-weight:700;font-family:var(--round)}
details.more summary{list-style:none;min-height:54px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;font-size:18px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary > svg:last-child{transform:rotate(180deg)}
.fin-rings{display:flex;align-items:center;gap:20px;margin-bottom:4px}

/* month */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 14px}
.mn-title{font-size:24px;font-weight:700}
.mstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
.ms .v{font-size:40px;font-weight:700;line-height:1.05}
.ms .k{font-size:16px;color:var(--muted);font-weight:600}
.cal{padding:16px 10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 0;text-align:center}
.cal-head span{font-size:14px;font-weight:600;color:var(--muted);padding-bottom:6px}
.cd{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--text)}
.cd .cn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:600}
.cd.w .cn{background:var(--c);color:#fff;font-weight:700}
.cd.today .cn{box-shadow:inset 0 0 0 2.5px var(--accent);color:var(--accent);font-weight:700}
.cd.today.w .cn{box-shadow:inset 0 0 0 2.5px #fff,0 0 0 2.5px var(--c);color:#fff}
.cd.fut{color:var(--faint)}
.cd .rd{width:6px;height:6px;border-radius:50%}
.cd .rd.on{background:var(--a-shoulders)}
.legend-row{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:14px;font-size:15px;color:var(--muted);font-weight:600}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:12px;height:12px;border-radius:50%;display:inline-block}
.legend-row i.rdot{width:7px;height:7px;background:var(--a-shoulders)}
.day-badge{width:56px;height:56px;border-radius:16px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.day-badge b{font-size:23px;font-family:var(--round)}
.day-badge small{font-size:13px;font-weight:600;opacity:.92;margin-top:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>

const CONFIG = {

};
/* ===================================================================== */

const APP_VERSION = '2.0';
const BUCKET = 'machine-photos';

/* ---------- יומן תקלות ---------- */
const LOG = [];
function log(...args) {
  const line = new Date().toTimeString().slice(0, 8) + '  ' + args.map(a => {
    if (typeof a === 'string') return a;

window.addEventListener('error', e => log('שגיאת JS:', e.message, `${e.filename || ''}:${e.lineno || ''}`));

function cleanUrl(u) {

const errInfo = e => e ? { name: e.name, status: e.status, code: e.code, message: e.message } : null;
const CK = 'koach-cache-v1', QK = 'koach-queue-v1', TK = 'koach-timer-v1';

const AREAS = [

  { k:'shoulders', n:'כתפיים',    c:'var(--a-shoulders)' },
  { k:'legs',      n:'רגליים',    c:'var(--a-legs)' },
  { k:'abs',       n:'בטן',       c:'var(--a-abs)' }
];
const AREA = Object.fromEntries(AREAS.map(a => [a.k, a]));
const TEMPLATES = { A:['back','biceps','abs'], B:['chest','triceps','shoulders','abs'], C:['legs','abs'] };
const TPL_NAME = { A:'א', B:'ב', C:'ג' };
const DAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DAY_LETTERS = ['א','ב','ג','ד','ה','ו','ש'];
const DEFAULT_SETTINGS = {
  rest: 120,
  minSets: { back:9, biceps:9, chest:9, triceps:9, shoulders:9, legs:12, abs:9 },
  split: { '0':'A', '1':'B', '2':'A', '3':'B', '4':'C', '5':null, '6':null },
  wakeLock: true, sound: true, theme: 'dark'
};
const CONFLICT = { sets:'id', machines:'id', rides:'id', workout_days:'user_id,workout_date', settings:'user_id' };

/* ---------- icons ---------- */
const I = {
  back:'<path d="M9 6l6 6-6 6"/>', fwd:'<path d="M15 6l-6 6 6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>', check:'<path d="M5 12l5 5 9-10"/>',
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  dumbbell:'<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>',
  settings:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  bike:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l3 7"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  image:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/>',
  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  watch:'<rect x="7" y="6" width="10" height="12" rx="3"/><path d="M9 6V3h6v3M9 18v3h6v-3"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4M10 2h4"/>',
  down:'<path d="M6 9l6 6 6-6"/>'
};
function svg(p, s = 24, w = 2) {
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const fmtDate = s => { const d = parseYmd(s); return `יום ${DAY_NAMES[d.getDay()]}, ${d.getDate()}.${d.getMonth() + 1}`; };
const shortDate = s => { const d = parseYmd(s); return `${d.getDate()}.${d.getMonth() + 1}`; };
const num = v => { if (v === null || v === undefined) return null; const s = String(v).trim().replace(',', '.'); if (s === '') return null; const n = parseFloat(s); return isFinite(n) ? n : null; };
const round2 = n => Math.round(n * 100) / 100;
const fmtW = w => { const n = Number(w) || 0; return Number.isInteger(n) ? String(n) : String(round2(n)); };
const ltr = s => `<span class="ltr num">${s}</span>`;
const fmtDur = sec => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${pad(s)}`; };
const fmtClock = ms => { const t = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; };
const setsTxt = n => n === 1 ? 'סט אחד' : `${n} סטים`;
const missTxt = n => n === 1 ? 'חסר סט אחד' : `חסרים ${n} סטים`;
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const areaName = k => AREA[k]?.n || k;
const areaColor = k => AREA[k]?.c || 'var(--muted)';
const setStr = s => `${fmtW(s.weight)}×${s.reps}`;

/* ---------- state ---------- */
const configured = !SB_URL.includes('YOUR-PROJECT') && !SB_KEY.includes('YOUR_KEY');
let sb = null;
const S = {
  user: null, loaded: false,
  machines: [], sets: [], days: {}, rides: [], settings: mergeSettings({}),
  maxByMachine: {}, photoUrls: {}, rangeStart: addDays(today(), -120),
  daySets: {}, dayLoading: {}, monthLoaded: {}, monthLoading: {},
  queue: [], draft: {}, edit: null, mfilter: 'all', showArchived: false,
  timer: null, route: { name: 'today' }, prevHash: '', curHash: location.hash
};

function mergeSettings(d) {
  d = d || {};
  return { ...DEFAULT_SETTINGS, ...d,
    minSets: { ...DEFAULT_SETTINGS.minSets, ...(d.minSets || {}) },
    split: { ...DEFAULT_SETTINGS.split, ...(d.split || {}) } };
}
const normSet = s => ({ ...s, weight: Number(s.weight) || 0, reps: Number(s.reps) || 0 });
const normMachine = m => ({ ...m, min_weight: Number(m.min_weight) || 0, weight_step: Number(m.weight_step) || 5, default_sets: Number(m.default_sets) || 3 });
const normRide = r => ({ ...r, distance_km: r.distance_km == null ? null : Number(r.distance_km) });

/* ---------- derived data ---------- */
function setsOn(date) {
  if (date >= S.rangeStart) return S.sets.filter(s => s.workout_date === date);
  return S.daySets[date] || [];
}
const machineById = id => S.machines.find(m => m.id === id);
function sortSets(a) { return a.slice().sort((x, y) => String(x.created_at || '').localeCompare(String(y.created_at || ''))); }
function areaCountsOn(date) {
  const c = {}; AREAS.forEach(a => c[a.k] = 0);
  for (const s of setsOn(date)) { const m = machineById(s.machine_id); if (m) c[m.area]++; }
  return c;
}
function templateFor(date) {
  const t = S.days[date]?.template;
  if (t === 'R') return null;
  if (t && TEMPLATES[t]) return t;
  return S.settings.split[String(parseYmd(date).getDay())] || null;
}
function minFor(area, date) {
  const t = templateFor(date);
  return t && TEMPLATES[t].includes(area) ? S.settings.minSets[area] : null;
}
function prevSession(mid, before) {
  let best = null;
  for (const s of S.sets) if (s.machine_id === mid && s.workout_date < before && (!best || s.workout_date > best)) best = s.workout_date;
  if (!best) return null;
  return { date: best, sets: sortSets(S.sets.filter(s => s.machine_id === mid && s.workout_date === best)) };
}
function machineMax(mid, excludeId) {
  let mx = S.maxByMachine[mid] ?? 0;
  for (const s of S.sets) if (s.machine_id === mid && s.id !== excludeId && s.weight > mx) mx = s.weight;
  return mx;
}
function hasHistory(mid) { return S.maxByMachine[mid] != null || S.sets.some(s => s.machine_id === mid); }
const rideOn = date => S.rides.find(r => r.ride_date === date) || null;
function daysForArea(a) {
  const l = [];
  for (let i = 0; i < 7; i++) { const t = S.settings.split[String(i)]; if (t && TEMPLATES[t].includes(a)) l.push(DAY_LETTERS[i]); }
  return l.length ? `ימים ${l.join(', ')}` : 'לא בחלוקה';
}
function lastDateForArea(a, before) {
  let best = null;
  for (const s of S.sets) { if (s.workout_date >= before) continue; const m = machineById(s.machine_id); if (m && m.area === a && (!best || s.workout_date > best)) best = s.workout_date; }
  return best;
}
function photoUrl(m) { return m && m.photo_path ? S.photoUrls[m.photo_path]?.url || null : null; }
function photoHtml(m, size = 22) {
  const u = photoUrl(m);
  return u ? `<img src="${esc(u)}" alt="" loading="lazy" decoding="async">` : svg(I.image, size, 1.7);
}

/* ---------- persistence: cache, queue ---------- */
let cacheT = null;
function saveCache() {
  clearTimeout(cacheT);
  cacheT = setTimeout(() => {
    try {
      localStorage.setItem(CK, JSON.stringify({ uid: S.user?.id, machines: S.machines, sets: S.sets, days: S.days, rides: S.rides,
        settings: S.settings, maxByMachine: S.maxByMachine, photoUrls: S.photoUrls, rangeStart: S.rangeStart }));
    } catch (e) {}
  }, 250);
}
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CK) || 'null');
    if (c && c.uid === S.user?.id) {
      Object.assign(S, { machines: c.machines || [], sets: c.sets || [], days: c.days || {}, rides: c.rides || [],
        settings: mergeSettings(c.settings?.minSets ? c.settings : {}), maxByMachine: c.maxByMachine || {}, photoUrls: c.photoUrls || {},
        rangeStart: c.rangeStart || S.rangeStart });
      S.loaded = true;
    }
    const q = JSON.parse(localStorage.getItem(QK) || '[]');
    S.queue = q.filter(o => o.uid === S.user?.id);
    S.queue.forEach(applyLocal);
    const t = JSON.parse(localStorage.getItem(TK) || 'null');
    if (t && t.end > Date.now() - 6000) S.timer = t;
  } catch (e) {}
  applyTheme();
}
function saveQueue() { try { localStorage.setItem(QK, JSON.stringify(S.queue)); } catch (e) {} }

function applyLocal(op) {
  const t = op.table;
  if (t === 'settings') { S.settings = mergeSettings(op.row.data); return; }
  if (t === 'workout_days') {
    if (op.op === 'upsert') S.days[op.row.workout_date] = { ...(S.days[op.row.workout_date] || {}), ...op.row };
    return;
  }
  const arr = t === 'sets' ? S.sets : t === 'machines' ? S.machines : t === 'rides' ? S.rides : null;
  if (!arr) return;
  const id = op.op === 'delete' ? op.id : op.row.id;
  const i = arr.findIndex(x => x.id === id);
  if (op.op === 'delete') { if (i >= 0) arr.splice(i, 1); }
  else {
    const row = t === 'sets' ? normSet(op.row) : t === 'machines' ? normMachine(op.row) : t === 'rides' ? normRide(op.row) : op.row;
    if (i >= 0) arr[i] = { ...arr[i], ...row }; else arr.push(row);
  }
}
function enqueue(op) {
  op.qid = uuid(); op.uid = S.user.id;
  if (op.table === 'settings') S.queue = S.queue.filter(o => o.table !== 'settings');
  applyLocal(op);
  S.queue.push(op);
  saveQueue(); saveCache(); flushSoon(); updateSync();
}
let flushing = false, flushT = null;
function flushSoon(ms = 150) { clearTimeout(flushT); flushT = setTimeout(flush, ms); }
async function flush() {
  if (flushing || !S.user || !S.queue.length) { updateSync(); return; }
  flushing = true;
  try {
    while (S.queue.length) {
      const op = S.queue[0];
      let res;
      try {
        res = op.op === 'delete'
          ? await sb.from(op.table).delete().eq('id', op.id)
          : await sb.from(op.table).upsert(op.row, { onConflict: CONFLICT[op.table] });
      } catch (e) { break; }
      if (res.error) {
        if (!res.error.code) break;           /* בעיית רשת: ננסה שוב אחר כך */
        log('שמירה נכשלה:', op.table, errInfo(res.error));
        toast('השמירה בשרת נכשלה: ' + res.error.message, 5000);
      }
      S.queue.shift(); saveQueue();
    }
  } finally { flushing = false; updateSync(); }
}
function updateSync() {
  const el = $('#sync'); if (!el) return;
  const n = S.queue.length;
  if (!S.user) { el.hidden = true; return; }
  if (!navigator.onLine) { el.hidden = false; el.textContent = n ? `לא מחובר, ${n} ממתינים` : 'לא מחובר'; }
  else if (n) { el.hidden = false; el.textContent = `שומר ${n}`; }
  else el.hidden = true;
}

/* ---------- server fetch ---------- */
async function fetchPaged(table, build, order) {
  let all = [], from = 0; const size = 1000;
  for (;;) {
    let q = build(sb.from(table).select('*'));
    order.forEach(o => { q = q.order(o); });
    const { data, error } = await q.range(from, from + size - 1);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < size) break;
    from += size;
  }
  return all;
}
async function fetchAll() {
  if (!S.user) return;
  const since = addDays(today(), -120);
  try {
    const [m, d, r, st, mx, sets] = await Promise.all([
      sb.from('machines').select('*').order('sort_order').order('name'),
      sb.from('workout_days').select('*').gte('workout_date', since),
      sb.from('rides').select('*').gte('ride_date', addDays(today(), -400)).order('ride_date'),
      sb.from('settings').select('*').maybeSingle(),
      sb.from('machine_max').select('*'),

let actx = null;
function ensureAudio() {
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}
function beep() {
  if (!S.settings.sound || !actx) return;
  try {
    [0, 0.25].forEach(off => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      const t0 = actx.currentTime + off; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18); o.start(t0); o.stop(t0 + 0.2); });
  } catch (e) {}
}
function startTimer(sec, name) {
  const s = sec ?? S.settings.rest;
  S.timer = { end: Date.now() + s * 1000, total: s, notified: false, name: name || '' };
  localStorage.setItem(TK, JSON.stringify(S.timer));
  tick();
}
function stopTimer() { S.timer = null; localStorage.removeItem(TK); $('#tf').hidden = true; tick(); }
function tick() {
  const el = document.getElementById('elapsed');
  if (el) { const st = S.days[today()]?.started_at; el.textContent = st ? fmtClock(Date.now() - Date.parse(st)) : ''; }
  const tb = $('#tb'), tf = $('#tf');
  if (!S.timer || !S.user) { tb.hidden = true; document.body.classList.remove('has-timer'); return; }
  const rem = Math.max(0, S.timer.end - Date.now()), frac = S.timer.total ? rem / (S.timer.total * 1000) : 0;
  const txt = fmtDur(Math.ceil(rem / 1000));
  tb.hidden = false; document.body.classList.add('has-timer');
  $('#tbTime').textContent = txt; $('#tfTime').textContent = txt;
  $('#tbRing').setAttribute('stroke-dashoffset', String(138.23 * (1 - frac)));
  $('#tfRing').setAttribute('stroke-dashoffset', String(829.38 * (1 - frac)));
  $('#tfName').textContent = S.timer.name || '';
  if (rem <= 0) {
    tb.classList.add('done'); tf.classList.add('done');
    $('#tbLbl').textContent = 'המנוחה נגמרה'; $('#tfLbl').textContent = 'המנוחה נגמרה';
    if (!S.timer.notified) {
      S.timer.notified = true; localStorage.setItem(TK, JSON.stringify(S.timer));
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

    }
  } else {

/* ---------- photos ---------- */
function compressImage(file, maxW = 900, q = 0.78) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.naturalWidth);
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => (b ? resolve(b) : reject(new Error('compress'))), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
    img.src = url;
  });
}

    const day = S.days[t] || {};
    const row = { user_id: S.user.id, workout_date: t, template: tpl };
    if (!day.started_at) row.started_at = new Date().toISOString();
    if (day.finished_at) row.finished_at = null;
    enqueue({ table: 'workout_days', op: 'upsert', row });
    go('#/workout');
  },
  switchTpl() {
    const cur = templateFor(today());
    openModal(`<h2>איזה אימון היום?</h2><div class="stack-sm">${Object.keys(TEMPLATES).map(k => `<button class="btn ${k === cur ? 'btn-primary' : 'btn-ghost'} btn-block" data-a="setTpl" data-t="${k}">אימון ${TPL_NAME[k]}: ${TEMPLATES[k].map(areaName).join(', ')}</button>`).join('')}
      <button class="btn btn-ghost btn-block" data-a="setTpl" data-t="R">יום מנוחה</button><button class="link" style="align-self:center" data-a="closeModal">ביטול</button></div>`);
  },
  setTpl(el) {
    enqueue({ table: 'workout_days', op: 'upsert', row: { user_id: S.user.id, workout_date: today(), template: el.dataset.t } });
    closeModal(); render();
  },
  closeModal() { closeModal(); },
  finish() {
    const t = today(), tpl = templateFor(t), counts = areaCountsOn(t), sets = setsOn(t), day = S.days[t] || {};
    const dur = day.started_at ? fmtClock(Date.now() - Date.parse(day.started_at)) : null;
    const hasWatch = day.avg_hr || day.max_hr || day.watch_kcal;
    openModal(`<h2>סיום אימון${tpl ? ' ' + TPL_NAME[tpl] : ''}</h2>
      ${tpl ? `<div class="fin-rings">${rings(TEMPLATES[tpl], counts, S.settings.minSets, 124)}${legend(TEMPLATES[tpl], counts, S.settings.minSets)}</div>` : ''}
      <div class="stats2"><div class="stat"><div class="k">סטים</div><div class="v num">${sets.length}</div></div>
        <div class="stat"><div class="k">משך</div><div class="v ltr num">${dur || '-'}</div></div></div>
      <details class="more" ${hasWatch ? 'open' : ''} style="margin-bottom:12px"><summary>${svg(I.watch, 22)}<span class="grow">נתוני שעון, רשות</span>${svg(I.down, 20)}</summary>
      <div class="grid3" style="margin-top:4px">
        <div class="field"><label for="whr" class="sub sm">דופק ממוצע</label><input class="input num" id="whr" inputmode="numeric" dir="ltr" value="${day.avg_hr ?? ''}"></div>
        <div class="field"><label for="whrm" class="sub sm">דופק מרבי</label><input class="input num" id="whrm" inputmode="numeric" dir="ltr" value="${day.max_hr ?? ''}"></div>
        <div class="field"><label for="wkc" class="sub sm">קלוריות שעון</label><input class="input num" id="wkc" inputmode="numeric" dir="ltr" value="${day.watch_kcal ?? ''}"></div></div></details>
      <button class="btn btn-primary btn-big btn-block" data-a="finishSave">שמור וסיים</button>
      <button class="btn btn-ghost btn-block" style="margin-top:10px" data-a="closeModal">חזרה לאימון</button>`);
  },
  finishSave() {
    const t = today(), day = S.days[t] || {};
    const iv = id => { const v = num($('#' + id).value); return v == null ? null : Math.round(v); };
    enqueue({ table: 'workout_days', op: 'upsert', row: { user_id: S.user.id, workout_date: t, template: templateFor(t), started_at: day.started_at || new Date().toISOString(), finished_at: new Date().toISOString(), avg_hr: iv('whr'), max_hr: iv('whrm'), watch_kcal: iv('wkc') } });
    closeModal(); stopTimer(); toast('האימון נשמר'); go('#/');
  },
  step(el) {
    const inp = document.getElementById(el.dataset.t); if (!inp) return;
    const st = parseFloat(el.dataset.st) || 1, d = parseInt(el.dataset.d, 10);
    const v = Math.max(0, round2((num(inp.value) || 0) + d * st));
    inp.value = fmtW(v); inp.dataset.dirty = '1';
    if (inp.dataset.draft && S.draft[S.route.a]) S.draft[S.route.a][inp.dataset.draft] = v;
  },
  saveSet(el) {
    ensureAudio();
    const m = machineById(el.dataset.id); if (!m) return;
    const w = Math.max(0, num($('#dw').value) || 0), r = Math.round(num($('#dr').value) || 0);
    if (r <= 0) { toast('הזן מספר חזרות'); $('#dr').focus(); return; }
    logSet(m, w, r);
  },
  repeatSet(el) {
    ensureAudio();
    const m = machineById(el.dataset.id); if (!m) return;
    const ts = sortSets(setsOn(today()).filter(s => s.machine_id === m.id)), l = ts[ts.length - 1];
    if (l) logSet(m, l.weight, l.reps);
  },
  editSet(el) {
    const s = S.sets.find(x => x.id === el.dataset.id); if (!s) return;
    const m = machineById(s.machine_id);
    openModal(`<h2>עריכת סט</h2><div class="stack">${stepper('ew', 'משקל, ק״ג', s.weight, m?.weight_step || 2.5)}${stepper('er', 'חזרות', s.reps, 1, { int: true })}
      <button class="btn btn-primary btn-block" data-a="updSet" data-id="${s.id}">שמור שינוי</button>
      <button class="btn btn-danger btn-block" data-a="delSet" data-id="${s.id}">${svg(I.trash, 20)}מחק את הסט</button>
      <button class="link" style="align-self:center" data-a="closeModal">ביטול</button></div>`);
  },
  updSet(el) {
    const s = S.sets.find(x => x.id === el.dataset.id); if (!s) return;
    const w = Math.max(0, num($('#ew').value) || 0), r = Math.round(num($('#er').value) || 0);
    if (r <= 0) { toast('הזן מספר חזרות'); return; }
    enqueue({ table: 'sets', op: 'upsert', row: { ...s, weight: w, reps: r } });
    closeModal(); render();
  },
  delSet(el) { enqueue({ table: 'sets', op: 'delete', id: el.dataset.id }); closeModal(); toast('הסט נמחק'); render(); },
  mfilter(el) { S.mfilter = el.dataset.k; render(); },
  toggleArch() { S.showArchived = !S.showArchived; render(); },
  farea(el) {
    S.edit.area = el.dataset.k;
    document.querySelectorAll('[data-a="farea"]').forEach(b => { const on = b.dataset.k === S.edit.area; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    $('#fhint').textContent = tplHint(S.edit.area);
  },
  fstep(el) {
    S.edit.step = parseFloat(el.dataset.v);
    document.querySelectorAll('[data-a="fstep"]').forEach(b => { const on = parseFloat(b.dataset.v) === S.edit.step; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    document.querySelectorAll('[data-t="fmin"]').forEach(b => { b.dataset.st = S.edit.step; });
  },
  async saveMachine(el) {
    const E = S.edit; if (!E) return;
    const name = $('#fname').value.trim();
    if (!name) { toast('הזן שם למכשיר'); $('#fname').focus(); return; }
    if (!E.area) { toast('בחר אזור בגוף'); return; }
    const old = E.isNew ? null : machineById(E.id);
    let photo_path = old?.photo_path || null;
    if (E.blob) {
      el.disabled = true; el.textContent = 'מעלה תמונה';
      const path = `${S.user.id}/${E.id}-${Date.now()}.jpg`;
      const { error } = await sb.storage.from(BUCKET).upload(path, E.blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: true });
      if (error) { toast('העלאת התמונה נכשלה, המכשיר נשמר בלי התמונה החדשה', 4500); }
      else {
        if (photo_path) sb.storage.from(BUCKET).remove([photo_path]);
        photo_path = path;
        S.photoUrls[path] = { url: E.preview, exp: 0 };
      }
    }
    const row = { id: E.id, user_id: S.user.id, name, area: E.area, min_weight: Math.max(0, num($('#fmin').value) || 0), weight_step: E.step,
      default_sets: Math.max(1, Math.round(num($('#fsets').value) || 3)), note: $('#fnote').value.trim() || null, photo_path,
      sort_order: old?.sort_order ?? S.machines.length, archived: old?.archived ?? false };
    enqueue({ table: 'machines', op: 'upsert', row });
    S.edit = null; toast('המכשיר נשמר');
    const back = S.prevHash && !S.prevHash.startsWith('#/edit') ? S.prevHash : '#/machines';
    go(back);
    refreshPhotos();
  },
  archive() {
    const m = machineById(S.edit?.id); if (!m) return;
    enqueue({ table: 'machines', op: 'upsert', row: { ...m, archived: !m.archived } });
    toast(m.archived ? 'המכשיר הוחזר' : 'המכשיר הועבר לארכיון'); S.edit = null; go('#/machines');
  },
  saveRide(el) {
    const date = el.dataset.date, r = rideOn(date), p = lastRideBefore(date);
    const sec = rideDuration(date);
    if (!sec) { toast('הזן את זמן הרכיבה'); $('#rmin').focus(); return; }
    const cal = rideFieldVal('rcal', p?.calories);
    let watts = num($('#rwatt').value), est = false;
    if (watts == null && cal && sec) { watts = Math.round(cal * 1000 / sec); est = true; }
    const iv = id => { const v = num($('#' + id).value); return v == null ? null : Math.round(v); };
    const bike = $('#rbike').value.trim() || p?.bike_no || null;
    enqueue({ table: 'rides', op: 'upsert', row: { id: r?.id || uuid(), user_id: S.user.id, ride_date: date, duration_sec: sec,
      distance_km: rideFieldVal('rdist', p?.distance_km), calories: cal == null ? null : Math.round(cal), avg_watts: watts == null ? null : Math.round(watts),
      watts_estimated: est, bike_no: bike, avg_hr: iv('rhr'), max_hr: iv('rhrm'), watch_kcal: iv('rwk') } });
    toast('הרכיבה נשמרה'); go(date === today() ? '#/' : '#/history/' + date);
  },
  delRide(el) {
    openModal(`<h2>למחוק את הרכיבה?</h2><div class="stack-sm"><button class="btn btn-danger btn-block" data-a="delRideYes" data-id="${el.dataset.id}">כן, מחק</button><button class="btn btn-ghost btn-block" data-a="closeModal">ביטול</button></div>`);
  },
  delRideYes(el) { enqueue({ table: 'rides', op: 'delete', id: el.dataset.id }); closeModal(); toast('הרכיבה נמחקה'); go('#/'); },
  sStep(el) {
    const k = el.dataset.k, d = parseInt(el.dataset.d, 10);
    if (k === 'rest') S.settings.rest = Math.min(600, Math.max(15, S.settings.rest + d * 15));
    else if (k.startsWith('min.')) { const a = k.slice(4); S.settings.minSets[a] = Math.min(40, Math.max(1, S.settings.minSets[a] + d)); }
    saveSettings(); render();
  },
  tFull() { $('#tf').hidden = false; },
  tClose() { $('#tf').hidden = true; },
  tAdd(el) {
    if (!S.timer) return;
    const d = parseInt(el.dataset.d, 10) * 1000;
    const base = Math.max(Date.now(), S.timer.end);
    S.timer.end = Math.max(Date.now() + 1000, base + d); S.timer.total = Math.max(S.timer.total, Math.ceil((S.timer.end - Date.now()) / 1000));
    S.timer.notified = false; localStorage.setItem(TK, JSON.stringify(S.timer)); tick();
  },
  tSkip() { stopTimer(); },
  async exportJson(el) {
    el.disabled = true; el.textContent = 'מכין קובץ';
    try { const all = await fetchEverything(); download(new Blob([JSON.stringify({ exported_at: new Date().toISOString(), settings: S.settings, ...all }, null, 2)], { type: 'application/json' }), `koach-backup-${today()}.json`); toast('הגיבוי ירד'); }
    catch (e) { toast('הייצוא נכשל. בדוק חיבור לאינטרנט'); }
    render();
  },
  async exportCsv(el) {
    el.disabled = true; el.textContent = 'מכין קובץ';
    try {
      const all = await fetchEverything(), mm = Object.fromEntries(all.machines.map(m => [m.id, m]));
      const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lines = [['תאריך', 'אזור', 'מכשיר', 'משקל', 'חזרות', 'שיא'].map(q).join(',')];
      all.sets.forEach(s => { const m = mm[s.machine_id]; lines.push([s.workout_date, areaName(m?.area), m?.name, s.weight, s.reps, s.is_pr ? 'כן' : ''].map(q).join(',')); });
      download(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), `koach-sets-${today()}.csv`); toast('הקובץ ירד');
    } catch (e) { toast('הייצוא נכשל. בדוק חיבור לאינטרנט'); }
    render();
  },
  refresh() { toast('מרענן'); flush().then(fetchAll); },
  signOut() {
    openModal(`<h2>להתנתק?</h2>${S.queue.length ? `<p class="err">יש ${S.queue.length} פעולות שעוד לא נשמרו בשרת. התנתקות עכשיו תמחק אותן.</p>` : '<p class="sub">הנתונים שמורים בשרת. בפעם הבאה תצטרך להיכנס עם אימייל וסיסמה.</p>'}
      <div class="stack-sm"><button class="btn btn-danger btn-block" data-a="signOutYes">התנתק</button><button class="btn btn-ghost btn-block" data-a="closeModal">ביטול</button></div>`);
  },
  async signOutYes() { closeModal(); await sb.auth.signOut(); },
  async diag(el) { el.disabled = true; el.textContent = 'בודק'; await runDiag(); el.disabled = false; el.textContent = 'בדיקת חיבור'; },
  async copyLog() {
    const t = LOG.join('\n');
    try { await navigator.clipboard.writeText(t); toast('היומן הועתק'); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($('#logbox')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('סמן והעתק ידנית'); }
  }
};

let settingsT = null;
function saveSettings() {
  applyTheme();
  clearTimeout(settingsT);
  settingsT = setTimeout(() => enqueue({ table: 'settings', op: 'upsert', row: { user_id: S.user.id, data: S.settings, updated_at: new Date().toISOString() } }), 500);
}
function applyTheme() {
  document.documentElement.dataset.theme = 'light';
  const m = $('meta[name="theme-color"]'); if (m) m.setAttribute('content', '#F2F2F7');
}
function resetState() {
  Object.assign(S, { machines: [], sets: [], days: {}, rides: [], settings: mergeSettings({}), maxByMachine: {}, photoUrls: {}, daySets: {}, monthLoaded: {}, monthLoading: {}, queue: [], draft: {}, edit: null, timer: null, loaded: false });
  try { localStorage.removeItem(CK); localStorage.removeItem(QK); localStorage.removeItem(TK); } catch (e) {}
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) { e.preventDefault(); A[el.dataset.a](el, e); return; }
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest('#app') && t.tagName === 'INPUT') t.dataset.dirty = '1';
  if (t.dataset.draft && S.draft[S.route.a]) { const v = num(t.value); if (v != null) S.draft[S.route.a][t.dataset.draft] = v; }
  if (['rmin', 'rsec', 'rcal', 'rwatt'].includes(t.id)) updateWattEstimate();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.s) {
    const k = t.dataset.s;
    if (k === 'split') S.settings.split[t.dataset.dow] = t.value || null;
    else if (k === 'wakeLock' || k === 'sound') S.settings[k] = t.checked;
    saveSettings(); render(); return;
  }
  if (t.id === 'hdate' && isDate(t.value)) { go(`#/history/${t.value}${t.dataset.area ? '/' + t.dataset.area : ''}`); return; }
  if (t.hasAttribute('data-photo') && t.files && t.files[0] && S.edit) {
    try {
      const blob = await compressImage(t.files[0]);
      if (S.edit.preview) URL.revokeObjectURL(S.edit.preview);
      S.edit.blob = blob; S.edit.preview = URL.createObjectURL(blob);
      $('#fphoto').innerHTML = `<img src="${S.edit.preview}" alt="תמונת המכשיר">`;
    } catch (err) { toast('לא הצלחתי לקרוא את התמונה'); }
    t.value = '';
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  const email = $('#lemail').value.trim(), password = $('#lpass').value, btn = $('#lbtn'), err = $('#lerr');
  if (!email || !password) { err.textContent = 'הזן אימייל וסיסמה'; return; }
  btn.disabled = true; btn.textContent = 'נכנס'; err.textContent = '';
  log('ניסיון כניסה:', email, '| אורך סיסמה', password.length);
  let error;
  try { ({ error } = await sb.auth.signInWithPassword({ email, password })); }
  catch (ex) { error = ex; }
  if (error) log('הכניסה נכשלה:', errInfo(error)); else log('הכניסה הצליחה');
  if (error) { err.textContent = /invalid login/i.test(error.message) ? 'האימייל או הסיסמה שגויים' : (error.message || 'שגיאה לא ידועה') + (error.status ? ` (${error.status})` : ''); btn.disabled = false; btn.textContent = 'כניסה'; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (!$('#tf').hidden) $('#tf').hidden = true; }
  if (e.key === 'Enter' && e.target.classList?.contains('sinput')) e.target.blur();
});
window.addEventListener('hashchange', () => { S.prevHash = S.curHash; S.curHash = location.hash; render(); window.scrollTo(0, 0); document.body.classList.remove('scrolled'); });
window.addEventListener('scroll', () => { document.body.classList.toggle('scrolled', window.scrollY > 36); }, { passive: true });
window.addEventListener('online', () => { updateSync(); flush(); });
window.addEventListener('offline', updateSync);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { updateWakeLock(); tick(); flush(); if (S.user) fetchAll(); }
  else updateWakeLock();
});
setInterval(tick, 250);
setInterval(() => { if (S.queue.length) flush(); }, 20000);

/* ---------- boot ---------- */
(function boot() {
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').then(() => log('אפליקציה במסך הבית: מוכנה לעבודה בלי רשת')).catch(e => log('רישום SW נכשל:', e.message));
  }
  log('גרסה', APP_VERSION, '| דפדפן:', navigator.userAgent);
  log('כתובת בקובץ:', CONFIG.SUPABASE_URL, SB_URL !== CONFIG.SUPABASE_URL ? '=> תוקנה ל ' + SB_URL : '(תקינה)');
  log('מפתח:', SB_KEY.slice(0, 18) + '…', 'אורך', SB_KEY.length, SB_KEY.startsWith('sb_publishable_') ? '(publishable, תקין)' : SB_KEY.startsWith('sb_secret_') ? '(סודי! אסור בדפדפן)' : SB_KEY.startsWith('eyJ') ? '(מפתח anon ישן)' : '(סוג לא מוכר)');
  log('ספריית Supabase נטענה:', !!window.supabase, '| מחובר לרשת:', navigator.onLine);
  if (!configured || !window.supabase) {
    render();
    if (configured && !window.supabase) $('#app').innerHTML = '<div class="empty" style="padding-top:30vh">טעינת הספרייה נכשלה. בדוק חיבור לאינטרנט ורענן.</div>';
    return;
  }
  sb = window.supabase.createClient(SB_URL, SB_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'koach-auth' }
  });
  sb.auth.onAuthStateChange((event, session) => {
    const u = session?.user || null;
    log('אירוע התחברות:', event, u ? 'משתמש ' + u.email : 'אין משתמש');
    if (u && (!S.user || S.user.id !== u.id)) {
      S.user = u; loadCache(); render();
      setTimeout(() => { flush(); fetchAll(); }, 0);
    } else if (!u && S.user) {
      S.user = null; resetState(); render();
    } else if (!u) {
      render();
    }
  });
})();
</script>
</body>
