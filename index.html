<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="כוח">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<title>כוח</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --a-back:#5856D6; --a-biceps:#FF2D55; --a-chest:#FF3B30; --a-triceps:#AF52DE;
  --a-shoulders:#FF9500; --a-legs:#34C759; --a-abs:#00B5AD;
  --accent:#007AFF; --accent-text:#0062CC; --accent-tint:rgba(0,122,255,.12); --on-accent:#FFFFFF;
  --bg:#F2F2F7; --surface:#FFFFFF; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.22);
  --sep:rgba(60,60,67,.18); --text:#1C1C1E; --muted:#6C6C70; --faint:#AEAEB2;
  --ok:#1E7B34; --okfill:#34C759; --ok-tint:rgba(52,199,89,.16);
  --warn:#A84B00; --warn-tint:rgba(255,149,0,.16);
  --danger:#D70015; --danger-tint:rgba(255,59,48,.12);
  --note-bg:#FFF4D6; --note:#6B4E00;
  --r-card:24px; --nav-h:68px;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Segoe UI","Noto Sans Hebrew",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
#app{max-width:600px;margin:0 auto;padding:0 18px calc(var(--nav-h) + 140px + var(--sb))}
button,input,select,textarea{font:inherit;color:inherit}
button,a,label{touch-action:manipulation}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:16px}
.sm{font-size:15px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:10px}
.hidden{display:none!important}
.center{align-self:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* navigation bar + large title */
.navbar{position:sticky;top:0;z-index:12;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:calc(52px + var(--st));padding:var(--st) 8px 0;margin:0 -18px;transition:background-color .2s,box-shadow .2s}
body.scrolled .navbar{background:rgba(242,242,247,.84);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nb-side{display:flex;align-items:center;min-width:0}
.nb-end{justify-content:flex-end}
.nb-title{font-size:18px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;text-align:center}
body.scrolled .nb-title{opacity:1}
.nb-back{display:inline-flex;align-items:center;gap:0;min-height:48px;padding:0 4px;color:var(--accent);text-decoration:none;font-size:18px;white-space:nowrap}
.nb-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--accent);text-decoration:none;background:transparent;border:0}
.nb-timer{display:inline-flex;align-items:center;gap:6px;padding:0 10px;font-size:19px;font-weight:600;color:var(--text)}
.arrows{display:inline-flex}
.large{padding:0 2px;margin-bottom:16px}
.large h1{margin:0;font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-.3px}
.large h1.sm{font-size:30px}
.lsub{font-size:16px;font-weight:600;color:var(--muted)}
.iconbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--accent);flex-shrink:0;text-decoration:none}
.navbar .iconbtn{background:transparent}

.h2{font-size:30px;font-weight:800;line-height:1.1}
.h3{font-size:20px;font-weight:700}
.section-title,.group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 6px 10px;font-size:21px;font-weight:700}
.group-head{justify-content:flex-start}
.section-title a,.link{font-size:17px;font-weight:500;color:var(--accent-text);background:none;border:0;padding:8px 4px;min-height:44px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.gh-v{display:inline-flex;align-items:center;gap:4px;font-size:19px;color:var(--muted);font-weight:600}
.gh-v.met{color:var(--ok)}

.card{background:var(--surface);border-radius:var(--r-card);padding:20px}
.card + .card{margin-top:14px}
.stack > .card + .card,.stack-sm > .card + .card{margin-top:0}

.btn{min-height:58px;border-radius:999px;border:0;padding:0 24px;font-size:19px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:transform .1s,opacity .1s;-webkit-user-select:none;user-select:none;position:relative}
.btn:active{transform:scale(.97);opacity:.85}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-tinted{background:var(--accent-tint);color:var(--accent-text)}
.btn-ghost{background:var(--surface);color:var(--text)}
.card .btn-ghost,.sheet .btn-ghost,.btn-gray{background:var(--fill);color:var(--text)}
.btn-danger{background:var(--danger-tint);color:var(--danger)}
.btn-block{width:100%}
.btn-big{min-height:66px;font-size:21px;font-weight:700}
.btn-sm{min-height:46px;padding:0 18px;font-size:17px}
.btn[disabled]{opacity:.5}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:15px;font-weight:600;padding:5px 12px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.neutral{background:var(--fill);color:var(--muted)}
.note{background:var(--note-bg);color:var(--note);border-radius:16px;padding:12px 16px;font-size:17px;margin-bottom:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 8px;margin:0 -18px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-size:17px;text-decoration:none;color:var(--text);flex-shrink:0}
.chip.on{background:var(--accent);color:#fff;font-weight:600}
.chip.on .dot{box-shadow:0 0 0 2px #fff}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;display:inline-block}
.bar{height:8px;border-radius:4px;background:var(--fill2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .3s}
.group-head + .bar{margin:0 6px 12px}

/* tab bar */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--sb));padding-bottom:var(--sb);background:rgba(249,249,251,.88);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);display:flex;z-index:20}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7C7C80;text-decoration:none;font-size:12px;font-weight:600}
.nav a svg{width:30px;height:30px}
.nav a.on{color:var(--accent)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin:0 0 16px;background:var(--surface);border-radius:var(--r-card);padding:14px 6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:600}
.wd .c{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--faint);font-family:var(--round)}
.wd.plan .c{background:var(--fill);color:var(--text)}
.wd.done .c{background:var(--c,var(--accent));color:#fff}
.wd.today{color:var(--accent)}
.wd.today .c{box-shadow:inset 0 0 0 2.5px var(--accent);color:var(--accent)}
.wd.today.done .c{box-shadow:inset 0 0 0 2.5px #fff,0 0 0 2.5px var(--c,var(--accent));color:#fff}
.wd .rd{width:6px;height:6px;border-radius:50%}
.wd .rd.on{background:var(--a-shoulders)}

/* today */
.today-card{display:flex;flex-direction:column;gap:20px}
.tc-head{display:flex;align-items:flex-start;gap:12px}
.tc-body{display:flex;align-items:center;gap:22px}
.rings{flex-shrink:0;display:block}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.legend li{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.lv{font-size:26px;font-weight:700;line-height:1}
.lv small{font-size:16px;color:var(--muted);font-weight:600}
.lv.met{color:var(--ok)}
.ride-card{display:flex;align-items:center;gap:14px}
.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;background:var(--c,var(--accent));color:#fff}
.ap{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:12px;font-size:18px;font-weight:600}
.ap .v{text-align:left;font-weight:700;font-family:var(--round)}
.ap .v.ok{color:var(--ok)}

/* lists */
.list{background:var(--surface);border-radius:20px;overflow:hidden}
.lrow,.srow2{position:relative}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:72px;text-decoration:none;color:var(--text);border:0;background:transparent;width:100%;text-align:right}
.lrow:active{background:var(--fill)}
.list .lrow + .lrow::before,.list .srow2 + .srow2::before{content:"";position:absolute;top:0;left:0;right:16px;height:.5px;background:var(--sep)}
.list .lrow + .lrow:has(.thumb)::before,.list .lrow + .lrow:has(.day-badge)::before,.list .lrow + .lrow:has(.ic)::before{right:86px}
.lrow .t{font-size:18px;font-weight:600}
.thumb{width:56px;height:56px;border-radius:14px;background:var(--fill);flex-shrink:0;overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.chev{color:#C4C4C7;flex-shrink:0;display:flex}
.done-ck{width:32px;height:32px;border-radius:50%;background:var(--okfill);color:#fff;display:grid;place-items:center;flex-shrink:0}
.cnt{font-size:17px;font-weight:700;color:var(--accent-text);background:var(--accent-tint);border-radius:999px;padding:4px 12px;flex-shrink:0}
.lrow.is-done .t{color:var(--muted)}
.add-row{color:var(--accent-text);font-weight:600;min-height:64px}

/* machine picker */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mcard{background:var(--surface);border-radius:20px;overflow:hidden;text-decoration:none;color:var(--text);display:flex;flex-direction:column}
.mcard.done{opacity:.55}
.mphoto{position:relative;aspect-ratio:4/3;background:var(--fill);display:grid;place-items:center;color:var(--muted)}
.mphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mphoto .badge{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92);color:var(--ok);font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px}
.mbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.mname{font-size:18px;font-weight:700;line-height:1.25}

/* logging */
.hero{width:100%;height:210px;border-radius:var(--r-card);overflow:hidden;background:var(--fill);margin-bottom:14px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.prev{background:var(--surface);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.prev-sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ps{background:var(--fill);border-radius:999px;padding:6px 14px;font-size:19px;font-weight:700}
.first{margin:0 4px 14px}
.sets-list{margin-bottom:14px}
.setrow{min-height:66px}
.setrow .n{width:58px;color:var(--muted);font-size:17px;font-weight:600}
.setrow .w{font-size:27px;font-weight:700}
.setcard{display:flex;flex-direction:column;gap:20px}
.sc-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.stepper{display:flex;flex-direction:column;gap:6px}
.slabel{font-size:16px;font-weight:600;color:var(--muted);text-align:center}
.srow{display:flex;align-items:center;gap:12px}
.sbtn{width:72px;height:72px;border-radius:50%;border:0;background:var(--fill);color:var(--accent);display:grid;place-items:center;flex-shrink:0;transition:transform .1s}
.sbtn:active{transform:scale(.92);background:var(--fill2)}
.sinput{flex:1;min-width:0;height:78px;text-align:center;font-size:60px;font-weight:700;background:transparent;border:0;border-radius:18px;padding:0;color:var(--text)}
.sinput:focus{outline:none;background:var(--accent-tint)}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:16px}

/* forms */
.field{display:flex;flex-direction:column;gap:8px}
.field label,.flabel{font-size:16px;font-weight:600;color:var(--muted);padding-inline:4px}
.input{height:58px;border:0;border-radius:16px;background:var(--surface);padding:0 16px;font-size:19px;width:100%}
.card .input,.sheet .input{background:var(--fill)}
.input:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent)}
.input::placeholder{color:var(--faint);opacity:1}
.big-input{height:72px;font-size:34px;font-weight:700;text-align:left;font-family:var(--round)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.photobox{height:230px;border-radius:var(--r-card);background:var(--surface);overflow:hidden;display:grid;place-items:center;color:var(--faint)}
.photobox img{width:100%;height:100%;object-fit:cover;display:block}
.seg{display:flex;gap:2px;background:var(--fill2);border-radius:14px;padding:3px}
.seg button{flex:1;min-height:48px;border-radius:11px;border:0;background:transparent;font-size:18px;font-weight:600}
.seg button.on{background:var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.mini{display:flex;align-items:center;gap:8px}
.mini button{width:48px;height:48px;border-radius:50%;border:0;background:var(--fill);color:var(--accent);display:grid;place-items:center}
.mini .val{min-width:64px;text-align:center;font-size:21px;font-weight:700}
.mini .input{background:var(--surface)}
.srow2{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;font-size:18px}
select.input{appearance:none;-webkit-appearance:none;height:46px;width:auto;min-width:130px;font-size:18px;padding:0 14px;background:var(--fill);color:var(--accent-text);font-weight:600}
.toggle{position:relative;width:56px;height:34px;flex-shrink:0}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:17px;background:var(--fill2);transition:background .2s}
.toggle span::after{content:"";position:absolute;top:2px;right:2px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.toggle input:checked + span{background:var(--okfill)}
.toggle input:checked + span::after{transform:translateX(-22px)}
.toggle input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}

/* rest timer */
.tb{position:fixed;z-index:30;bottom:calc(var(--nav-h) + var(--sb) + 12px);left:50%;transform:translateX(-50%);width:min(564px,calc(100% - 24px));height:86px;border-radius:30px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--text);display:flex;align-items:center;gap:8px;padding:0 12px;box-shadow:0 10px 30px rgba(0,0,0,.14),0 0 0 .5px var(--sep)}
.tb[hidden]{display:none}
.tb-main{flex:1;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:inherit;min-height:64px;text-align:right;padding:0}
.tb .ring{color:var(--accent)}
.ring .trk{fill:none;stroke:currentColor;opacity:.16}
.ring .prg{fill:none;stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.tb-txt{display:flex;flex-direction:column;line-height:1.05}
.tb-lbl{font-size:15px;color:var(--muted);font-weight:600}
.tb-time{font-size:34px;font-weight:700;font-family:var(--round)}
.tb-btn{min-width:56px;height:56px;border-radius:999px;border:0;background:var(--fill);color:var(--accent-text);font-size:17px;font-weight:700;padding:0 12px}
.tb.done{background:var(--okfill);color:#fff}
.tb.done .ring,.tb.done .tb-lbl{color:#fff}
.tb.done .tb-btn{background:rgba(255,255,255,.25);color:#fff}
.tf{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;padding:calc(var(--st) + 12px) 20px calc(var(--sb) + 24px)}
.tf[hidden]{display:none}
.tf-top{align-self:stretch;display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:600}
.tf-top .iconbtn{color:var(--muted)}
.tf-lbl{font-size:22px;font-weight:600;color:var(--muted);margin-top:4vh}
.tf-ring{position:relative;width:min(320px,80vw);aspect-ratio:1;margin-top:3vh;display:grid;place-items:center;color:var(--accent)}
.tf-ring svg{position:absolute;inset:0;width:100%;height:100%}
.tf-time{font-size:min(104px,26vw);font-weight:700;line-height:1;font-family:var(--round)}
.tf-btns{display:flex;gap:14px;margin-top:32px}
.tf-btns button{width:112px;height:68px;border-radius:999px;border:0;background:var(--surface);color:var(--accent-text);font-size:24px;font-weight:700}
.tf.done .tf-ring{color:var(--okfill)}
.tf.done .tf-time{color:var(--ok)}

/* sheet, toast, sync */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:28px 28px 0 0;padding:10px 20px calc(var(--sb) + 22px);max-height:90vh;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 14px}
.sheet h2{margin:0 0 16px;font-size:26px;font-weight:800}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;z-index:70;top:calc(var(--st) + 14px);left:50%;transform:translateX(-50%) translateY(-24px);background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--text);padding:14px 22px;border-radius:999px;font-size:17px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.16);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sync{position:fixed;z-index:25;bottom:calc(var(--nav-h) + var(--sb) + 10px);left:50%;transform:translateX(-50%);font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;background:#FFF1DE;color:var(--warn);box-shadow:0 4px 14px rgba(0,0,0,.08)}
body.has-timer .sync{bottom:calc(var(--nav-h) + var(--sb) + 108px)}
.sync[hidden]{display:none}

.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:calc(var(--st) + 24px) 0 40px}
.app-icon{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 26px rgba(0,98,204,.28);margin-bottom:10px}
.brand{font-size:56px;font-weight:800;line-height:1}
.err{color:var(--danger);font-size:16px;min-height:22px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .btn{margin-top:14px}
.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--fill);border-radius:16px;padding:12px 14px}
.stat .k{font-size:15px;color:var(--muted);font-weight:600}
.stat .v{font-size:28px;font-weight:700;font-family:var(--round)}
details.more summary{list-style:none;min-height:54px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;font-size:18px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary > svg:last-child{transform:rotate(180deg)}
.fin-rings{display:flex;align-items:center;gap:20px;margin-bottom:4px}

/* month */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 14px}
.mn-title{font-size:24px;font-weight:700}
.mstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
.ms .v{font-size:40px;font-weight:700;line-height:1.05}
.ms .k{font-size:16px;color:var(--muted);font-weight:600}
.cal{padding:16px 10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 0;text-align:center}
.cal-head span{font-size:14px;font-weight:600;color:var(--muted);padding-bottom:6px}
.cd{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--text)}
.cd .cn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:600}
.cd.w .cn{background:var(--c);color:#fff;font-weight:700}
.cd.today .cn{box-shadow:inset 0 0 0 2.5px var(--accent);color:var(--accent);font-weight:700}
.cd.today.w .cn{box-shadow:inset 0 0 0 2.5px #fff,0 0 0 2.5px var(--c);color:#fff}
.cd.fut{color:var(--faint)}
.cd .rd{width:6px;height:6px;border-radius:50%}
.cd .rd.on{background:var(--a-shoulders)}
.legend-row{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:14px;font-size:15px;color:var(--muted);font-weight:600}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:12px;height:12px;border-radius:50%;display:inline-block}
.legend-row i.rdot{width:7px;height:7px;background:var(--a-shoulders)}
.day-badge{width:56px;height:56px;border-radius:16px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.day-badge b{font-size:23px;font-family:var(--round)}
.day-badge small{font-size:13px;font-weight:600;opacity:.92;margin-top:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===================== 2.1: שפת עיצוב 2027 ===================== */
:root{
  --r-card:26px; --nav-h:64px; --tb-h:72px;
  --nav-bottom:max(calc(var(--sb) - 12px), 10px);
  --above-nav:calc(var(--nav-bottom) + var(--nav-h) + 12px);
  --glass:rgba(250,250,252,.66); --glass-edge:rgba(255,255,255,.85);
  --float:0 14px 34px rgba(17,24,39,.14),0 2px 8px rgba(17,24,39,.06);
  --lift:0 1px 2px rgba(17,24,39,.04),0 8px 24px rgba(17,24,39,.045);
  --accent-grad:linear-gradient(180deg,#2A93FF 0%,#0A72F2 100%);
}
html{min-height:100%}
#app{padding-bottom:calc(var(--above-nav) + 150px)}
.large h1{font-size:40px;letter-spacing:-.6px}
.large h1.sm{font-size:31px;letter-spacing:-.4px}
.lsub{letter-spacing:.1px}
.h2{letter-spacing:-.4px}

/* משטחים: צל עדין במקום שטוח לגמרי */
.card,.list,.week,.mcard,.prev,.photobox{box-shadow:var(--lift)}
.card,.list{outline:.5px solid rgba(17,24,39,.035);outline-offset:-.5px}

/* כפתורים */
.btn-primary{background:var(--accent-grad);box-shadow:0 8px 20px rgba(10,114,242,.26),inset 0 1px 0 rgba(255,255,255,.28)}
.btn-tinted{background:rgba(0,122,255,.11)}
.btn:active{transform:scale(.975)}

/* פס ניווט עליון: זכוכית עם קצה רך */
body.scrolled .navbar{background:rgba(242,242,247,.74);box-shadow:none}
.navbar::after{content:"";position:absolute;inset:auto 0 -16px 0;height:16px;pointer-events:none;background:linear-gradient(rgba(242,242,247,.74),rgba(242,242,247,0));opacity:0;transition:opacity .2s}
body.scrolled .navbar::after{opacity:1}

/* סרגל לשוניות צף */
.nav{left:max(14px,calc(50% - 290px));right:max(14px,calc(50% - 290px));bottom:var(--nav-bottom);height:var(--nav-h);padding:6px;gap:2px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  box-shadow:var(--float),inset 0 0 0 .5px var(--glass-edge),inset 0 1px 0 rgba(255,255,255,.95)}
.nav a{border-radius:999px;font-size:11px;gap:1px;transition:background-color .2s,color .2s}
.nav a svg{width:26px;height:26px}
.nav a.on{background:rgba(0,122,255,.12)}

/* טיימר מנוחה צף */
.tb{bottom:var(--above-nav);height:var(--tb-h);width:min(580px,calc(100% - 28px));border-radius:999px;padding:0 10px 0 8px;
  background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  box-shadow:var(--float),inset 0 0 0 .5px var(--glass-edge),inset 0 1px 0 rgba(255,255,255,.95)}
.tb-main{min-height:60px}
.tb .ring{width:50px;height:50px}
.tb-time{font-size:30px}
.tb-btn{min-width:52px;height:52px;background:rgba(118,118,128,.14)}
.tb.done{background:rgba(48,190,84,.92);animation:pulse 1s ease-in-out 3}
.tb.done .tb-time{color:#fff}
.tf-btns button{box-shadow:var(--lift)}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.03)}}
#flash{position:fixed;inset:0;z-index:65;pointer-events:none;opacity:0;
  background:radial-gradient(120% 80% at 50% 100%,rgba(52,199,89,.55),rgba(52,199,89,.12) 60%,rgba(52,199,89,0) 85%)}
#flash.on{animation:flash 1.4s ease-out 2}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

/* סטטוס סנכרון */
.sync{top:calc(var(--st) + 74px);bottom:auto;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;font-size:14px;
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--float),inset 0 0 0 .5px var(--glass-edge);color:var(--text)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.sync.syncing::before{animation:blink 1s ease-in-out infinite}
.sync.offline::before{background:#FF9500}
.sync.failed::before{background:var(--danger)}
.sync.ok::before{background:var(--okfill)}
body.has-timer .sync{bottom:auto}
@keyframes blink{50%{opacity:.25}}
.syncbox{display:flex;flex-direction:column;gap:4px}
.syncbox .st{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.syncbox .st i{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--okfill)}
.syncbox .st i.wait{background:#FF9500}
.syncbox .st i.bad{background:var(--danger)}

/* גיליון וטוסט */
.sheet{border-radius:34px 34px 0 0;box-shadow:0 -10px 40px rgba(17,24,39,.12)}
.toast{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:var(--float),inset 0 0 0 .5px var(--glass-edge)}

/* רישום לאגודל אחד */
.sinput[readonly]{cursor:pointer;-webkit-user-select:none;user-select:none;caret-color:transparent}
.sinput[readonly]:focus{background:transparent}
.sinput:not([readonly]){background:var(--accent-tint)}
.sbtn{background:rgba(118,118,128,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.qchips{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap;margin-top:6px}
.qchip{flex:1;max-width:66px;min-width:0;height:50px;padding:0;border-radius:999px;border:0;background:rgba(118,118,128,.12);color:var(--text);font:700 20px var(--round);transition:background-color .15s,color .15s,transform .1s}
.qchip:active{transform:scale(.94)}
.qchip.on{background:var(--accent);color:#fff}
.target{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:-6px;font-size:16px;font-weight:600;color:var(--muted)}
.target b{color:var(--text);font-family:var(--round)}
.dock{position:sticky;bottom:var(--above-nav);z-index:11;margin-top:14px}
body.has-timer .dock{bottom:calc(var(--above-nav) + var(--tb-h) + 10px)}
.dock .btn{box-shadow:0 12px 28px rgba(10,114,242,.34),inset 0 1px 0 rgba(255,255,255,.3)}
.setup{display:flex;align-items:center;gap:10px;margin:-6px 2px 14px;padding:12px 16px;border-radius:18px;background:var(--accent-tint);color:var(--accent-text);font-size:18px;font-weight:600}
.setup svg{flex-shrink:0}
.rest-val{min-width:96px;text-align:center;font-size:19px;font-weight:700}
.rest-val small{display:block;font-size:13px;color:var(--muted);font-weight:600}

/* כשהמקלדת פתוחה: מסתירים את מה שצף בתחתית */
body.kb .nav,body.kb .tb,body.kb .sync,body.kb .dock{visibility:hidden}

@media (prefers-reduced-motion: reduce){#flash.on{animation:none;opacity:.6}.tb.done{animation:none}}

/* ===================== 2.3: עיצוב בהשראת Boostcamp, כהה, צהוב, גדול ===================== */
:root,html[data-theme]{
  --bg:#0A0A0B; --surface:#17171A; --surface2:#212125; --fill:rgba(255,255,255,.08); --fill2:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.08); --text:#F5F5F7; --muted:#A3A3AB; --faint:#5E5E66;
  --accent:#FCC100; --accent-text:#FCC100; --accent-tint:rgba(252,193,0,.14); --on-accent:#0A0A0B;
  --accent-grad:linear-gradient(180deg,#FFD02E 0%,#FCC100 100%);
  --ok:#FCC100; --okfill:#FCC100; --ok-tint:rgba(252,193,0,.14);
  --warn:#FFB340; --warn-tint:rgba(255,179,64,.14); --danger:#FF5A5F; --danger-tint:rgba(255,90,95,.12);
  --note-bg:rgba(252,193,0,.1); --note:#FFD86B;
  --a-back:#7B79FF; --a-biceps:#FF4F7B; --a-chest:#FF5A4E; --a-triceps:#C77DFF; --a-shoulders:#FFA13D; --a-legs:#4ADE80; --a-abs:#2DD4BF;
  --glass:rgba(28,28,32,.72); --glass-edge:rgba(255,255,255,.1);
  --lift:none; --float:0 16px 40px rgba(0,0,0,.55);
  --r-card:28px; --nav-h:76px; --tb-h:78px;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{font-size:20px;line-height:1.38}
#app{padding-bottom:calc(var(--above-nav) + 170px)}
.sub{font-size:17px}
.sm{font-size:16px}
.card,.list,.week,.mcard,.prev,.photobox{background:var(--surface);box-shadow:none;outline:none}

/* טיפוגרפיה גדולה */
.large{padding-top:6px}
.large h1{font-size:48px;font-weight:900;letter-spacing:-1.2px;line-height:1.05}
.large h1.sm{font-size:36px;font-weight:900;letter-spacing:-.8px}
.lsub{font-size:17px;font-weight:700;color:var(--muted);letter-spacing:.2px}
.h2{font-size:32px;font-weight:900;letter-spacing:-.6px}
.h3{font-size:24px;font-weight:800;letter-spacing:-.3px}
.section-title,.group-head{font-size:24px;font-weight:900}
.nb-title{font-weight:800}
body.scrolled .navbar{background:rgba(10,10,11,.82)}
.navbar::after{background:linear-gradient(rgba(10,10,11,.82),rgba(10,10,11,0))}

/* כפתורים */
.btn{min-height:62px;font-size:21px;font-weight:800;border-radius:20px}
.btn-big{min-height:74px;font-size:24px;border-radius:22px}
.btn-sm{min-height:50px;font-size:18px}
.btn-primary,#app .btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 30px rgba(252,193,0,.22)}
.btn-tinted{background:var(--accent-tint);color:var(--accent)}
.btn-ghost,.card .btn-ghost,.btn-gray{background:var(--surface2);color:var(--text)}
.link{color:var(--accent);font-weight:700}

/* רשימות */
.lrow{min-height:84px;font-size:21px}
.lrow .t{font-size:21px;font-weight:800}
.thumb{width:64px;height:64px;border-radius:16px;background:var(--surface2)}
.chev{color:var(--faint)}
.done-ck{background:var(--accent);color:var(--on-accent)}
.cnt{background:var(--accent-tint);color:var(--accent)}
.pill.ok{background:var(--accent);color:var(--on-accent)}
.pill.neutral{background:var(--surface2);color:var(--text)}
.chip{min-height:52px;font-size:19px;background:var(--surface2);color:var(--text)}
.chip.on{background:var(--accent);color:var(--on-accent)}
.seg{background:var(--surface2)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.input{background:var(--surface2);color:var(--text);min-height:62px;font-size:21px;border-radius:18px}
.input:focus{box-shadow:0 0 0 2.5px var(--accent)}
.toggle input:checked + span{background:var(--accent)}
.note{background:var(--note-bg);color:var(--note);font-weight:600}
.setup{background:var(--surface2);color:var(--text);font-size:19px}
.setup svg{color:var(--accent)}
.bar{background:rgba(255,255,255,.1);height:10px}
.bar>i{background:var(--accent)!important}
.dot{box-shadow:none}
.stat{background:var(--surface2)}

/* שבוע */
.week{padding:14px 10px}
.wd{font-size:15px;font-weight:700;color:var(--muted)}
.wd .c{width:44px;height:44px;font-size:19px;font-weight:900;color:var(--faint);background:transparent}
.wd.plan .c{background:var(--surface2);color:var(--text)}
.wd.done .c{background:var(--accent);color:var(--on-accent)}
.wd.today{color:var(--text)}
.wd.today .c{box-shadow:inset 0 0 0 2.5px var(--accent);color:var(--accent)}
.wd.today.done .c{box-shadow:0 0 0 3px rgba(252,193,0,.35);color:var(--on-accent)}
.wd .rd.on,.cd .rd.on{background:var(--a-shoulders)}

/* מסך היום */
.hero-w{padding:24px 22px 22px;margin-top:6px;background:radial-gradient(120% 90% at 100% 0%,rgba(252,193,0,.16),rgba(252,193,0,0) 60%),var(--surface)}
.hero-w .kick{font-size:16px;font-weight:800;color:var(--accent);letter-spacing:.3px}
.hero-w .big{font-size:52px;font-weight:900;letter-spacing:-1.4px;line-height:1.02;margin:4px 0 4px}
.hero-w .areas{font-size:19px;font-weight:600;color:var(--muted);margin-bottom:18px}
.arow{display:flex;flex-direction:column;gap:9px;padding:14px 0;border-top:1px solid var(--sep)}
.arow:first-of-type{border-top:0}
.arow .top{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800}
.arow .v{margin-inline-start:auto;font:900 24px var(--round)}
.arow .v small{font-size:17px;color:var(--muted);font-weight:700}
.arow.met .v{color:var(--accent)}
.hero-w .btn-big{margin-top:16px}
.wkstats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.wkstats .s{background:var(--surface);border-radius:24px;padding:18px 20px}
.wkstats .v{font:900 40px/1 var(--round);letter-spacing:-1px}
.wkstats .k{font-size:16px;font-weight:700;color:var(--muted);margin-top:6px}
.ride-card .ic{width:62px;height:62px;border-radius:18px}
.ride-card .h3{font-size:24px}

/* מסך אימון: כרטיסי מכשיר גדולים */
.xhead{display:flex;align-items:center;gap:12px;margin:34px 4px 12px}
.xhead .n{font-size:28px;font-weight:900;letter-spacing:-.5px}
.xhead .c{margin-inline-start:auto;font:900 22px var(--round);padding:6px 14px;border-radius:999px;background:var(--surface2)}
.xhead .c.met{background:var(--accent);color:var(--on-accent)}
.xhead .dot{width:14px;height:14px}
.xlist{display:flex;flex-direction:column;gap:12px}
.xcard{display:flex;align-items:center;gap:16px;padding:14px;border-radius:26px;background:var(--surface);color:var(--text);text-decoration:none;min-height:116px;transition:transform .12s}
.xcard:active{transform:scale(.985);background:var(--surface2)}
.xcard .xt{width:88px;height:88px;border-radius:20px;overflow:hidden;background:#fff;flex-shrink:0;display:grid;place-items:center;color:#6b6b73}
.xcard .xt img{width:100%;height:100%;object-fit:cover}
.xcard .xn{font-size:22px;font-weight:800;line-height:1.2;letter-spacing:-.2px}
.xcard .xs{font-size:17px;color:var(--muted);margin-top:3px}
.xdots{display:flex;gap:7px;margin-top:10px}
.xdots i{width:22px;height:8px;border-radius:999px;background:rgba(255,255,255,.14)}
.xdots i.on{background:var(--accent)}
.xcard .xe{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:var(--faint)}
.xcard.done .xe{background:var(--accent);color:var(--on-accent)}
.xcard.done .xn{color:var(--muted)}

/* מסך מכשיר: טבלת סטים */
.stable{padding:10px 8px 6px}
.st-cap{display:flex;justify-content:space-between;padding:8px 12px 6px;font-size:16px;font-weight:700;color:var(--muted)}
.st-h,.st-r{display:grid;grid-template-columns:52px 1.25fr 1fr 1fr 52px;align-items:center;gap:4px;padding:0 8px;text-align:center}
.st-h{font-size:14px;font-weight:800;color:var(--faint);letter-spacing:.4px;padding-bottom:6px}
.st-r{min-height:64px;border-radius:18px;font:800 23px var(--round);color:var(--text);background:none;border:0;width:100%}
.st-r + .st-r{margin-top:4px}
.st-r .sn{font-size:20px;color:var(--muted)}
.st-r .sp{font-size:17px;font-weight:700;color:var(--muted);direction:ltr}
.st-r .ck{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin:auto;background:var(--surface2);color:transparent}
.st-r.done .ck{background:var(--accent);color:var(--on-accent)}
.st-r.done{background:rgba(252,193,0,.07)}
.st-r.cur{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--accent)}
.st-r.cur .sn{color:var(--accent)}
.st-r.fut{color:var(--faint)}
.setcard .sc-head .h3{font-size:26px}
.sinput{font-size:64px!important;font-weight:900}
.sbtn{width:80px;height:80px;background:var(--surface2);box-shadow:none;color:var(--accent)}
.qchip{height:54px;background:var(--surface2);color:var(--text);font-size:21px}
.qchip.on{background:var(--accent);color:var(--on-accent)}
.target{color:var(--muted)}
.target b{color:var(--accent)}
.sinput:not([readonly]){background:var(--accent-tint)}
.dock .btn{box-shadow:0 14px 34px rgba(252,193,0,.28)}

/* סרגל לשוניות */
.nav{background:rgba(24,24,28,.86);box-shadow:var(--float),inset 0 0 0 .5px rgba(255,255,255,.1)}
.nav a{color:#8E8E96;font-size:13px;font-weight:700}
.nav a svg{width:30px;height:30px}
.nav a.on{background:rgba(252,193,0,.14);color:var(--accent)}

/* טיימר */
.tb{background:rgba(24,24,28,.9);color:var(--text);box-shadow:var(--float),inset 0 0 0 .5px rgba(255,255,255,.1)}
.tb .ring{color:var(--accent)}
.tb-time{font-size:32px}
.tb-btn{background:var(--surface2);color:var(--text)}
.tb.done{background:var(--accent);color:var(--on-accent)}
.tb.done .ring,.tb.done .tb-lbl,.tb.done .tb-time{color:var(--on-accent)}
.tb.done .tb-btn{background:rgba(0,0,0,.12);color:var(--on-accent)}
.tf{background:var(--bg);color:var(--text)}
.tf-ring{color:var(--accent)}
.tf.done .tf-ring,.tf.done .tf-time{color:var(--accent)}
.tf-btns button{background:var(--surface2);color:var(--text);box-shadow:none}
#flash{background:radial-gradient(120% 80% at 50% 100%,rgba(252,193,0,.5),rgba(252,193,0,.12) 60%,rgba(252,193,0,0) 85%)}

/* היסטוריה */
.cd .cn{font-size:19px;font-weight:700}
.cd.w .cn{background:var(--accent);color:var(--on-accent)!important}
.cd.today .cn{box-shadow:inset 0 0 0 2.5px var(--accent)}
.ms .v{font-size:46px;font-weight:900;letter-spacing:-1px}
.ms .k{font-weight:700}
.chart{padding:20px 18px 16px}
.chart h3{margin:0 0 12px;font-size:18px;font-weight:800;color:var(--muted)}
.chart svg{display:block;width:100%;height:130px}
.chart .ax{display:flex;justify-content:space-between;margin-top:8px;font:700 14px var(--round);color:var(--faint)}

/* גיליונות, טוסט, סנכרון */
.sheet{background:var(--surface)}
.toast,.sync{background:rgba(32,32,36,.94);color:var(--text)}
.login .app-icon{align-self:center;margin-inline:auto;box-shadow:0 14px 40px rgba(252,193,0,.25)}
.login .brand,.login > p.sub{text-align:center;align-self:center}
.login .brand{font-size:56px;font-weight:900}

/* ===================== 2.4: בית, כפתור אימון מרכזי, סינון באימון ===================== */
:root,html[data-theme]{ --above-nav:calc(var(--nav-bottom) + var(--nav-h) + 30px); }

/* סרגל לשוניות עם כפתור אימון מרכזי */
.nav{gap:0;padding:6px 4px}
.nav a{font-size:12px;min-width:0}
.nav a.fab{position:relative;justify-content:flex-end;padding-bottom:6px;background:transparent!important;color:#8E8E96}
.nav a.fab.on{color:var(--accent)}
.fab-w{position:absolute;top:-32px;left:50%;transform:translateX(-50%);width:78px;height:78px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.nav a .fab-r{position:absolute;inset:0;width:78px;height:78px}
.fab-c{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 24px rgba(252,193,0,.3);transition:transform .12s}
.nav a .fab-c svg{width:34px;height:34px}
.nav a.fab:active .fab-c{transform:scale(.93)}

/* בית: כרטיס היום, שורות אזור לחיצות */
.hero-w .arow{color:var(--text);text-decoration:none;border-radius:4px}
.hero-w .arow:active{opacity:.7}
.hero-w .arow .v{margin:0 auto 0 0}
.arow .chev{display:flex;color:var(--faint);margin-inline-start:4px}

/* בית: סטים השבוע מול היעד */
.wk{margin-top:14px;padding:22px 20px 16px}
.dash-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dash-h h2{margin:0;font-size:26px;font-weight:900;letter-spacing:-.5px}
.dash-n{font:900 30px var(--round);letter-spacing:-.5px}
.dash-n small{font-size:18px;color:var(--muted);font-weight:800}
.dash-sub{font-size:16px;font-weight:700;color:var(--muted);margin:2px 0 6px}
.wr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:14px;row-gap:9px;padding:13px 0 12px;border-top:1px solid var(--sep)}
.wr:first-of-type{border-top:0}
.wr .nm{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;min-width:0;line-height:1.15}
.wr .nm .dot{width:12px;height:12px}
.wr small.behind{display:block;font-size:14px;font-weight:700;color:var(--warn);margin-top:3px}
.wr .vv{display:inline-flex;align-items:center;gap:0;justify-content:flex-end;min-width:76px;font:900 22px var(--round)}
.wr .vv small{font-size:16px;color:var(--muted);font-weight:800}
.wr .vv svg{margin-right:4px}
.wr.met .vv{color:var(--accent)}
.wr .tb2{grid-column:1/-1;position:relative}
.wr .mk{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:#fff}
.spark{display:flex;align-items:flex-end;gap:3px;height:28px}
.spark i{display:block;width:6px;border-radius:2px;background:rgba(255,255,255,.13)}
.spark i.part{background:rgba(252,193,0,.42)}
.spark i.met{background:var(--accent)}
.spark i.now{outline:1.5px solid rgba(255,255,255,.55);outline-offset:1px}
.wk-foot{font-size:14px;font-weight:600;color:var(--faint);margin-top:8px;line-height:1.35}

/* בית: ספינינג */
.spin{margin-top:14px;padding:20px 20px 18px}
.spin .top{display:flex;align-items:center;gap:14px}
.bigw{display:flex;align-items:center;gap:12px;margin:20px 0 8px}
.bigw .v{font:900 60px/.95 var(--round);letter-spacing:-2px}
.bigw .u{font-size:17px;font-weight:800;color:var(--muted);line-height:1.2}
.delta{display:inline-flex;align-items:center;font-size:16px;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--surface2);color:var(--text)}
.delta.up{background:var(--accent-tint);color:var(--accent)}
.delta.down{color:var(--warn)}
.spchart{margin-top:12px}
.spchart svg{display:block;width:100%;height:auto}
.spax{display:flex;justify-content:space-between;margin-top:4px;font:700 14px var(--round);color:var(--faint)}
.spwk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--sep)}
.spwk div{display:flex;flex-direction:column;align-items:flex-start}
.spwk b{font:900 26px var(--round)}
.spwk span{font-size:15px;font-weight:700;color:var(--muted)}

/* בית: סטטיסטיקה */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.tile{background:var(--surface);border-radius:24px;padding:18px 18px 16px;min-height:138px;display:flex;flex-direction:column}
.tile .v{font:900 40px/1 var(--round);letter-spacing:-1px}
.tile .v small{font-size:20px;color:var(--muted);font-weight:800;letter-spacing:0}
.tile .k{font-size:16px;font-weight:700;color:var(--muted);margin-top:8px;line-height:1.25}
.tile .s{font-size:14px;font-weight:800;color:var(--faint);margin-top:auto;padding-top:8px;line-height:1.3}
.tile .s.up{color:var(--accent)}

/* אימון: בורר אזור קבוע בראש המסך */
.wseg{position:sticky;top:calc(52px + var(--st));z-index:13;display:grid;gap:5px;margin:0 -18px 4px;padding:6px 18px 12px;background:var(--bg)}
.wseg a{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:72px;padding:6px 2px 14px;border-radius:18px;background:var(--surface);color:var(--text);text-decoration:none;transition:transform .1s}
.wseg a:active{transform:scale(.96)}
.wseg .n{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;letter-spacing:-.2px}
.wseg a.all{padding-inline:9px}
.wseg a.all .c{font-size:17px}
body.scrolled .navbar{background:rgba(10,10,11,.96)}
.wseg .c{display:inline-flex;align-items:center;gap:3px;font:900 19px var(--round)}
.wseg .pt{position:absolute;left:12px;right:12px;bottom:7px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.wseg .p{display:block;height:100%;border-radius:2px;background:var(--accent)}
.wseg a.on .pt{background:rgba(0,0,0,.14)}
.wseg a.met:not(.on) .c{color:var(--accent)}
.wseg a.on{background:var(--accent);color:var(--on-accent)}
.wseg a.on .p{background:var(--on-accent)}
.xs .busy{color:var(--warn);font-weight:700}

/* מכשיר: ערכים מוצעים באפור עד שנוגעים */
.sinput.ghost{color:var(--faint)}
.st-r.cur.ghost #curW,.st-r.cur.ghost #curR{color:var(--faint)}
.st-r.cur.ghost{box-shadow:inset 0 0 0 2px rgba(252,193,0,.45)}
.ghint{font-size:16px;font-weight:700;color:var(--muted);margin-top:-10px;line-height:1.35}
.sugg{display:flex;align-items:center;gap:12px;width:100%;text-align:right;border:0;border-radius:18px;padding:14px 14px 14px 12px;background:var(--accent-tint);color:var(--text);font-size:18px;font-weight:700;line-height:1.3}
.sugg svg{color:var(--accent);flex-shrink:0}
.sugg b{color:var(--accent);font-family:var(--round);font-size:24px}
.sugg .sg-t{display:block;font-size:20px;font-weight:800}
.sugg .sg-s{display:block;font-size:15px;font-weight:700;color:var(--muted);margin-top:2px}
.stepper:has(.sinput.ghost) .qchip.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 2px rgba(252,193,0,.55)}
.sugg .sg-btn{flex-shrink:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:9px 14px;font-size:16px;font-weight:800}
.undo{display:flex;align-items:center;gap:12px;margin-top:-4px;padding:8px 8px 8px 16px;border-radius:18px;background:var(--surface2);font-size:18px;font-weight:700}
.undo button{margin-inline-start:auto;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--text);color:var(--bg);font-size:18px;font-weight:800}
.linkbtn{margin-bottom:14px}
.dock a.btn svg{margin-inline-start:2px}

/* היסטוריה: סטים לעריכה */
button.ps{border:0;color:var(--text);font-family:var(--round);font-size:19px;font-weight:700;min-height:44px;cursor:pointer}
button.ps:active{background:var(--fill2)}

/* כפתורי בחירת אימון בשתי שורות */
.btn.tplbtn{flex-direction:column;gap:2px;white-space:normal;min-height:78px;padding:12px 18px;line-height:1.15}
.btn.tplbtn b{font-size:22px;font-weight:900}
.btn.tplbtn small{font-size:16px;font-weight:700;opacity:.72}

/* ===================== 2.5 ===================== */
/* סרגל תחתון אטום יותר, כדי שכפתורים צהובים מתחתיו לא יצבעו אותו */
.nav{background:rgba(22,22,26,.97)}

/* אימון: שורת סיכום מה נשאר, ולשוניות אזור עם שם בלבד */
.wsum{display:flex;align-items:center;gap:12px;margin:-6px 2px 10px;font-size:18px;font-weight:700;color:var(--muted);line-height:1.3}
.wsum .done{display:inline-flex;align-items:center;gap:6px;color:var(--accent)}
.wall{flex-shrink:0;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--surface2);color:var(--text);font-size:17px;font-weight:800;text-decoration:none}
.wall.on{background:var(--accent);color:var(--on-accent)}
.wseg a{min-height:58px;padding:8px 4px 16px}
.wseg .n{font-size:16px;letter-spacing:-.2px}
.wseg .ok{position:absolute;top:5px;left:6px;display:flex;color:var(--accent)}
.wseg a.on .ok{color:var(--on-accent)}

/* בית: ספינינג עם ארבעה מדדים */
.stabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.stab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 2px 9px;border:0;border-radius:18px;background:var(--surface2);color:var(--text);min-width:0}
.stab .v{font:900 22px/1.1 var(--round);letter-spacing:-.5px}
.stab .l{font-size:14px;font-weight:800;color:var(--muted)}
.stab .d{font-size:12.5px;font-weight:800;color:var(--faint);margin-top:2px;white-space:nowrap}
.stab .d.up{color:var(--accent)}
.stab .d.down{color:var(--warn)}
.stab.on{background:var(--accent);color:var(--on-accent)}
.stab.on .l,.stab.on .d,.stab.on .d.up,.stab.on .d.down{color:var(--on-accent);opacity:.78}
.stab:active{transform:scale(.97)}
.spwk1{margin-top:14px;padding-top:12px;border-top:1px solid var(--sep);font-size:16px;font-weight:700;color:var(--muted)}

/* היסטוריה: יום לעריכה */
.hday{padding:16px}
.hday .prev-sets{margin-top:12px}
button.ps.add{display:inline-flex;align-items:center;justify-content:center;min-width:52px;background:var(--accent-tint);color:var(--accent)}

.wsum .nw{white-space:nowrap}

/* ===================== 2.6 ===================== */
/* אימון: בורר אימון להיום בפס העליון */
.tsel{display:flex;gap:6px}
.tsel button{width:46px;height:46px;border-radius:14px;border:0;background:var(--surface2);color:var(--text);font-size:20px;font-weight:900;transition:transform .1s}
.tsel button.on{background:var(--accent);color:var(--on-accent)}
.tsel button:active{transform:scale(.94)}

/* מכשיר: רצועת המכשירים של האזור */
.mstrip{display:flex;gap:8px;overflow-x:auto;margin:-10px -18px 12px;padding:8px 18px 10px;scrollbar-width:none;overscroll-behavior-x:contain}
.mstrip::-webkit-scrollbar{display:none}
.ms{flex:0 0 80px;display:flex;flex-direction:column;align-items:center;gap:13px;text-decoration:none;color:var(--muted);min-width:0}
.ms .mt{position:relative;width:64px;height:64px;border-radius:18px;background:#fff;display:grid;place-items:center;color:#6b6b73}
.ms .mt img{width:100%;height:100%;object-fit:cover;border-radius:18px;display:block}
.ms.on .mt{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent)}
.ms.done .mt img,.ms.done .mt>svg{opacity:.38}
.ms .mn{font-size:14px;font-weight:800;line-height:1.2;text-align:center;width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ms .mn b{color:var(--warn)}
.ms.on .mn{color:var(--text)}
.ms .mck{position:absolute;bottom:-6px;left:-6px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.ms .mcn{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--text);font:800 13px/1.35 var(--round);font-style:normal;box-shadow:0 0 0 3px var(--bg);white-space:nowrap}
.ms:active .mt{transform:scale(.95)}

/* מכשיר: לשוניות כוונון, הסבר, חימום */
.itabs{display:grid;gap:6px;margin-bottom:10px}
.itab{min-height:54px;border:0;border-radius:16px;background:var(--surface);color:var(--text);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 6px;transition:transform .1s}
.itab:active{transform:scale(.97)}
.itab svg{flex-shrink:0;color:var(--accent)}
.itab.nil{color:var(--faint)}
.itab.nil svg{color:var(--faint)}
.itab.on,.itab.on.nil{background:var(--accent);color:var(--on-accent)}
.itab.on svg{color:var(--on-accent)}
.ipanel{background:var(--surface);border-radius:22px;padding:16px 18px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.ip-setup{font-size:22px;font-weight:800;line-height:1.3}
.ip-note{font-size:18px;font-weight:700;color:var(--note);line-height:1.35}
.ip-empty{font-size:17px;font-weight:600;color:var(--muted);line-height:1.4}
.ip-empty a{color:var(--accent);font-weight:800}
.wu{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:8px 16px}
.wu > b{font:900 18px var(--round);color:var(--muted)}
.wu .wv .num{font:900 30px var(--round);letter-spacing:-.5px}
.wu .wv small{font-size:16px;color:var(--muted);font-weight:800;margin-inline-end:8px}

/* מכשיר: יעד, RIR בסט שבוצע, הוספה והסרה של סטים */
.st-tgt{display:flex;align-items:center;gap:8px;margin:2px 8px 10px;padding:10px 14px;border-radius:14px;background:var(--accent-tint);color:var(--accent);font-size:18px;font-weight:800}
.st-tgt svg{flex-shrink:0}
.st-r .rp{display:flex;flex-direction:column;align-items:center;line-height:1}
.st-r .rp small{font:800 12px var(--round);color:var(--accent);margin-top:4px;direction:ltr;opacity:.85}
.st-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 4px 4px}
.st-foot.one{grid-template-columns:1fr}
.st-foot button{min-height:52px;border:0;border-radius:16px;background:var(--surface2);color:var(--text);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
.st-foot button svg{color:var(--accent)}
.st-foot button:active{transform:scale(.97)}

/* RIR */
.rirbox{display:flex;flex-direction:column;gap:8px}
.rirbox .slabel small{display:block;font-size:14px;font-weight:700;color:var(--faint);margin-top:2px}
.rirbox .qchips{margin-top:0}
.qchip.tg:not(.on){box-shadow:inset 0 0 0 2px rgba(252,193,0,.55)}

/* גיליון מכשיר תפוס */
.sheet .list{background:var(--surface2)}
.sheet .lrow .thumb{background:#fff;color:#6b6b73}
.sheet .list .lrow + .lrow::before{background:rgba(255,255,255,.08)}

/* עריכת מכשיר: טווח חזרות */
.repsbox{display:flex;flex-direction:column;gap:8px}
.repsbox .mini .val{min-width:44px}
.mini .val{color:var(--text)}

/* ===================== 2.7 ===================== */
/* כותרת עם בורר האימון באותה שורה */
.lhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lhead h1{min-width:0}
.lhead .tsel button{width:46px;height:46px;font-size:20px}

/* אימון: לשוניות אזור גדולות יותר */
.wseg a{min-height:66px;padding:8px 4px 16px}
.wseg .n{font-size:18px;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.08;text-align:center}

/* אימון: באנר אזור שהושלם */
.abn{background:var(--accent);color:var(--on-accent);border-radius:24px;padding:16px;margin:6px 0 10px;display:flex;flex-direction:column;gap:12px}
.abn-t{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:-.3px}
.abn-b{display:flex;align-items:center;justify-content:center;min-height:60px;padding:0 14px;border-radius:18px;border:0;background:var(--on-accent);color:var(--accent);font-size:19px;font-weight:800;text-decoration:none;width:100%;text-align:center;line-height:1.2;transition:transform .1s}
.abn-b:active{transform:scale(.98)}
.abn-b small{display:block;font-size:15px;font-weight:700;opacity:.8;margin-top:2px}
.abn-b span{padding:8px 0}
.xopt{font-size:17px;font-weight:800;color:var(--muted);margin:14px 6px 0}
.xcard .xs b{color:var(--accent);font-weight:800}
.xdone{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:14px 16px;border:0;border-radius:22px;background:var(--surface);color:var(--text);text-align:right;min-height:72px}
.xdone .ck{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex-shrink:0}
.xdone .t{display:block;font-size:19px;font-weight:800}
.xdone .s{display:block;font-size:15px;font-weight:600;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xdone .chv{color:var(--faint);display:flex;transition:transform .2s}
.xdone[aria-expanded="true"] .chv{transform:rotate(180deg)}

/* בית: סטים השבוע, אזור מול יום */
.wk2{margin-top:14px;padding:20px 14px 16px}
.wk2 .dash-h,.wk2 .dash-sub{padding:0 6px}
.wgrid{display:grid;align-items:center;gap:6px 4px;margin-top:14px}
.wdh{text-align:center;font:800 15px var(--round);color:var(--muted)}
.wdh.td{color:var(--accent)}
.wn{font-size:16px;font-weight:800;line-height:1.15;padding-inline-start:6px;min-width:0}
.wc{height:36px;border-radius:10px;display:grid;place-items:center;font:900 16px var(--round);text-decoration:none;color:var(--text);box-sizing:border-box}
a.wc:active{transform:scale(.94)}
.wc.met{background:var(--accent);color:var(--on-accent)}
.wc.part{background:var(--surface2);color:var(--accent)}
.wc.miss{border:2px solid var(--warn);color:var(--warn)}
.wc.now{border:2px solid var(--accent);color:var(--muted)}
.wc.plan{border:2px dashed rgba(255,255,255,.18);color:var(--faint)}
.wc.extra{background:var(--surface2);color:var(--text)}
.wt{text-align:left;font:900 17px var(--round);padding-inline-end:4px;white-space:nowrap}
.wt small{font-size:13px;color:var(--muted);font-weight:800}
.wt.met{color:var(--accent)}
.wleg{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:16px;padding:0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.wleg span{display:inline-flex;align-items:center;gap:6px}
.wleg .wc{width:16px;height:16px;border-radius:5px;display:inline-block}

/* בית: ספינינג, שלושה מדדים */
.sp3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.sp3 button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 10px 10px;border:0;border-top:4px solid var(--c);border-radius:16px;background:var(--surface2);color:var(--text);text-align:right;min-width:0;transition:opacity .15s,transform .1s}
.sp3 button:active{transform:scale(.97)}
.sp3 button.dim{opacity:.45}
.sp3 .v{font:900 26px/1.1 var(--round);letter-spacing:-.5px}
.sp3 .l{font-size:15px;font-weight:800;color:var(--muted)}
.sp3 .d{font-size:12.5px;font-weight:800;color:var(--faint);margin-top:4px;line-height:1.25}
.sp3 .d.up{color:var(--accent)}
.sp3 .d.down{color:var(--warn)}

/* מכשירים: שינוי סדר */
.reo{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:14px 16px;margin:4px 0 0}
.reo .t{font-size:19px;font-weight:800}
.ro .robtn{display:flex;gap:8px}
.ro .robtn button{width:52px;height:52px;border-radius:16px;border:0;background:var(--surface2);color:var(--accent);display:grid;place-items:center}
.ro .robtn button:active{transform:scale(.94)}
.ro .robtn button.hid{visibility:hidden}

/* ===================== 2.8 ===================== */
/* ספינינג: ציר אחוזים, היום מימין */
.spchart svg{overflow:visible}
.spax.one{justify-content:center;text-align:center}

/* השבוע עד היום: כרטיסים עם אייקון */
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.t2{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:186px;padding:16px 16px 14px;border-radius:24px;background:var(--surface)}
.t2::after{content:"";position:absolute;left:-46px;top:-46px;width:120px;height:120px;border-radius:50%;background:var(--c);opacity:.07;pointer-events:none}
.t2-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.t2-ic{position:relative;width:52px;height:52px;display:grid;place-items:center;color:var(--c);flex-shrink:0}
.t2-ic .rg{position:absolute;inset:0;width:52px;height:52px}
.t2-ic .in{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent)}
.t2-top .pct{font:900 16px var(--round);color:var(--c);margin-top:4px}
.t2 .v{font:900 38px/1 var(--round);letter-spacing:-1px;margin-top:14px}
.t2 .v small{font-size:18px;color:var(--muted);font-weight:800;letter-spacing:0}
.t2 .k{font-size:17px;font-weight:800;margin-top:6px}
.t2-days{display:flex;justify-content:space-between;margin-top:auto;padding-top:12px;position:relative;z-index:1}
.t2-days span{display:flex;flex-direction:column;align-items:center;gap:4px;font:800 11px var(--round);color:var(--faint)}
.t2-days span.td{color:var(--text)}
.t2-days i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.07)}
.t2-days i.on{background:var(--c)}
.t2-days i.miss{background:transparent;box-shadow:inset 0 0 0 2px var(--warn)}
.t2-days i.plan{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.t2-pill{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;margin-top:auto;padding:6px 11px;border-radius:999px;font-size:13.5px;font-weight:800;background:var(--surface2);color:var(--muted);position:relative;z-index:1}
.t2-pill.up{background:rgba(74,222,128,.14);color:var(--a-legs)}
.t2-pill.down{background:var(--warn-tint);color:var(--warn)}
.t2-foot{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:5px;position:relative;z-index:1}
.t2-foot .t2-pill{margin-top:0}
.t2-cap{font-size:13px;font-weight:700;color:var(--faint);line-height:1.25}

/* ===================== 2.9 ===================== */
/* צבעים: כהה רך יותר, גרפיט במקום שחור */
:root,html[data-theme]{
  --bg:#17181C; --surface:#23252B; --surface2:#2F323A; --fill:rgba(255,255,255,.09); --fill2:rgba(255,255,255,.16);
  --sep:rgba(255,255,255,.09); --text:#F7F7F9; --muted:#B3B4BD; --faint:#777985; --on-accent:#16171A;
  --glass:rgba(38,40,47,.8); --float:0 16px 40px rgba(0,0,0,.4);
}
.card,.list,.week,.t2,.tile,.xcard,.ipanel,.itab,.reo{box-shadow:inset 0 1px 0 rgba(255,255,255,.045)}
body.scrolled .navbar{background:rgba(23,24,28,.96)}
.navbar::after{background:linear-gradient(rgba(23,24,28,.9),rgba(23,24,28,0))}
.nav{background:rgba(40,42,49,.97)}
.tb{background:rgba(40,42,49,.96)}
.toast,.sync{background:rgba(50,52,60,.97)}
.xcard .xt,.ms .mt,.sheet .lrow .thumb{background:#fff}
.wc.plan{border-color:rgba(255,255,255,.24)}
.t2-days i{background:rgba(255,255,255,.1)}

/* התקדמות */
.ups{margin-top:12px;padding:6px 14px}
.uprow{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--text);text-decoration:none;border-top:1px solid var(--sep)}
.uprow:first-child{border-top:0}
.uprow .thumb{width:48px;height:48px;background:#fff;color:#6b6b73}
.uprow .t{font-size:18px;font-weight:800}
.upd{display:inline-flex;align-items:center;gap:3px;padding:6px 11px;border-radius:999px;background:rgba(74,222,128,.14);color:var(--a-legs);font:900 15px var(--round)}
.cons{margin-top:14px}
.cons-b{display:flex;align-items:center;gap:18px;margin-top:14px}
.cons-r{width:112px;height:112px;flex-shrink:0}
.cons-l{display:flex;flex-direction:column;gap:14px;min-width:0}
.cl{display:flex;gap:10px;align-items:flex-start}
.cl i{width:12px;height:12px;border-radius:50%;margin-top:9px;flex-shrink:0}
.cl b{display:block;font:900 28px/1.05 var(--round)}
.cl span{display:block;font-size:15px;font-weight:700;color:var(--muted);margin-top:2px;line-height:1.3}
.effc{margin-top:14px}
.eff{display:grid;grid-template-columns:86px minmax(0,1fr) 40px 76px;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--sep)}
.eff:first-of-type{border-top:0}
.eff .nm{font-size:17px;font-weight:800}
.ebar{position:relative;height:8px;border-radius:4px;background:linear-gradient(to left,rgba(255,90,95,.55) 0%,rgba(252,193,0,.75) 20%,rgba(252,193,0,.75) 60%,rgba(255,255,255,.14) 70%)}
.ebar i{position:absolute;top:50%;width:16px;height:16px;margin-right:-8px;border-radius:50%;background:var(--text);transform:translateY(-50%);box-shadow:0 0 0 3px var(--surface)}
.ev{font:900 20px var(--round);text-align:center}
.et{font-size:13.5px;font-weight:800;text-align:center;padding:4px 6px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.et.good{background:var(--accent-tint);color:var(--accent)}
.et.hard{background:var(--danger-tint);color:var(--danger)}
.eff-scale{display:flex;justify-content:space-between;margin:6px 0 2px;font-size:12px;font-weight:700;color:var(--faint);padding-right:96px;padding-left:126px}

/* ===================== 3.0 ===================== */
/* שעון אימון */
.sess-go{margin-bottom:0}
.sess{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:var(--surface);margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)}
.sess.on{background:linear-gradient(120deg,rgba(252,193,0,.16),rgba(252,193,0,.04));box-shadow:inset 0 0 0 1.5px rgba(252,193,0,.45)}
.sess .k{font-size:16px;font-weight:800;color:var(--muted)}
.sess .v{font:900 32px/1.1 var(--round);letter-spacing:-.5px}
.sess.done .v{font-size:20px;font-weight:800;font-family:inherit;letter-spacing:0;color:var(--text)}
.sess-dot{width:14px;height:14px;border-radius:50%;background:var(--danger);flex-shrink:0;box-shadow:0 0 0 0 rgba(255,90,95,.6);animation:sessPulse 1.6s infinite}
@keyframes sessPulse{0%{box-shadow:0 0 0 0 rgba(255,90,95,.55)}70%{box-shadow:0 0 0 12px rgba(255,90,95,0)}100%{box-shadow:0 0 0 0 rgba(255,90,95,0)}}
@media (prefers-reduced-motion:reduce){.sess-dot{animation:none}}
.sess-ic{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex-shrink:0}
.sess-stop{min-height:52px;padding:0 18px;font-size:18px}
.nav a.fab.live .fab-t{font:900 15px var(--round);color:var(--accent);direction:ltr}
.nav a.fab.live .fab-c{box-shadow:0 0 0 3px rgba(255,90,95,.9),0 8px 24px rgba(252,193,0,.3)}
.finseg{margin-bottom:14px}

/* סטים השבוע: שורה לכל אזור */
.wk2{padding:20px 16px 16px}
.wk2 .dash-h,.wk2 .dash-sub{padding:0 2px}
.wg-days,.wg-cells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wg-days{margin:14px 0 2px}
.wg-days span{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.wg-days b{font:900 16px var(--round);color:var(--muted)}
.wg-days small{font:700 11px var(--round);color:var(--faint)}
.wg-days .off b{color:var(--faint)}
.wg-days .td b,.wg-days .td small{color:var(--accent)}
.wg-row{padding-top:12px}
.wg-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 7px}
.wg-h .wn{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;padding:0}
.wg-h .dot{width:9px;height:9px}
.wc.none{background:transparent}
.wc.none::after{content:"";width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.13)}

/* ספינינג: רמת קושי וסוג אופניים */
.btleg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-top:6px;font-size:13px;font-weight:700;color:var(--muted)}
.btleg span{display:inline-flex;align-items:center;gap:6px}
.btleg i{width:14px;height:14px;border-radius:5px}
.rtypes{display:flex;flex-wrap:wrap;gap:8px}

/* ===================== 3.1 ===================== */
/* סטים השבוע: טבלה נקייה */
.wk3{padding:20px 16px 16px}
.wk3-n{font-size:15px;font-weight:700;color:var(--muted)}
.wk3-n b{font:900 26px var(--round);color:var(--text)}
.wk3-g{display:grid;grid-template-columns:74px repeat(7,minmax(0,1fr)) 52px;align-items:stretch;margin-top:12px}
.wk3-g > *{display:flex;align-items:center;justify-content:center;min-height:42px;border-top:1px solid var(--sep);text-decoration:none;color:var(--text)}
.wk3-g .th{border-top:0;min-height:28px;font:800 14px var(--round);color:var(--faint)}
.wk3-g .th.now{color:var(--accent)}
.wk3-g .td{background:rgba(252,193,0,.07)}
.wk3-g .th.td{border-radius:10px 10px 0 0}
.wk3-g .tn{justify-content:flex-start;font-size:15px;font-weight:800;line-height:1.15}
.wk3-g .tc{font:800 16px var(--round)}
.wk3-g .tc.ok{color:var(--accent)}
.wk3-g .tc.lo{color:var(--text)}
.wk3-g .tc.mi{color:var(--warn)}
.wk3-g .tc.pl{color:var(--faint);font-weight:700}
.wk3-g a.tc:active{background:var(--fill)}
.wk3-g .tt{justify-content:flex-end;font:900 15px var(--round);color:var(--text)}
.wk3-g .tt.ok{color:var(--accent)}
.wk3-leg{margin-top:12px;font-size:13px;font-weight:600;color:var(--faint);line-height:1.5}
.wk3-leg .ok{color:var(--accent)}
.wk3-leg .mi{color:var(--warn)}

/* בורר סוג האימון */
.tsel2{display:flex;gap:8px;overflow-x:auto;margin:-6px -18px 14px;padding:2px 18px 4px;scrollbar-width:none}
.tsel2::-webkit-scrollbar{display:none}
.tsel2 button{flex:0 0 auto;min-width:48px;min-height:46px;padding:0 16px;border:0;border-radius:14px;background:var(--surface2);color:var(--text);font-size:18px;font-weight:900;white-space:nowrap}
.tsel2 button.on{background:var(--accent);color:var(--on-accent)}
.tsel2 button:active{transform:scale(.95)}
.fchips{margin-bottom:6px}

/* הגדרות: סוגי אימונים */
button.lrow{width:100%;border:0;background:transparent;color:inherit;text-align:right;font:inherit}
.tbadge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;font:900 17px var(--round);color:var(--on-accent);background:var(--c)}

/* ===================== 3.2 ===================== */
/* ספינינג: ממוצעים ויומן רכיבות */
.sp4{padding:20px 16px 16px}
.sp4-s{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;border-top:1px solid var(--sep);border-bottom:1px solid var(--sep)}
.sp4-m{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px}
.sp4-m + .sp4-m{border-right:1px solid var(--sep)}
.sp4-m .l{font-size:14px;font-weight:700;color:var(--muted)}
.sp4-m .v{font:900 28px/1.1 var(--round);letter-spacing:-.5px}
.sp4-m .d{font-size:13px;font-weight:800;color:var(--faint)}
.sp4-m .d.up{color:var(--a-legs)}
.sp4-m .d.down{color:var(--warn)}
.sp4-t{margin:16px 2px 2px;font-size:15px;font-weight:800;color:var(--muted)}
.sp4-g{display:grid;grid-template-columns:minmax(0,1.5fr) 44px repeat(3,minmax(0,1fr))}
.sp4-g > *{display:flex;align-items:center;justify-content:center;min-height:44px;border-top:1px solid var(--sep);color:var(--text);text-decoration:none}
.sp4-g .sh{border-top:0;min-height:28px;font-size:13px;font-weight:700;color:var(--faint)}
.sp4-g .sd{flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.15}
.sp4-g .sd b{font-size:15px;font-weight:800}
.sp4-g .sd small{font-size:12px;font-weight:600;color:var(--faint)}
.sp4-g .td{background:rgba(252,193,0,.07)}
.sp4-g .td b{color:var(--accent)}
.sp4-g .sc{font:800 16px var(--round)}
.sp4-g .sc.top{color:var(--accent)}
.sp4-g .sc.na{color:var(--faint)}
.sp4-g .lvl{min-width:30px;padding:2px 6px;border-radius:8px;background:var(--surface2);font:900 14px var(--round);text-align:center}
.sp4-g a.sd:active{background:var(--fill)}

/* ===================== 3.3 ===================== */
.spbar-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 2px 6px}
.spbar-h .t{font-size:15px;font-weight:800;color:var(--muted)}
.spseg{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--surface2)}
.spseg button{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:800;min-height:34px;padding:0 11px;border-radius:9px}
.spseg button.on{background:var(--accent);color:var(--on-accent)}
.spbars{display:block;width:100%;height:auto}
.spbars .sbar{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.spbars .sbar{animation:none}}
.splv{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin:4px 2px 0;font-size:12.5px;font-weight:700;color:var(--faint)}
.splv i{width:64px;height:8px;border-radius:4px}
.splv .num{font:900 13px var(--round);color:var(--muted)}
.splv .nr{flex-basis:100%;font-weight:600}

/* ===================== 3.4 ===================== */
/* כותרת הבית: תאריך בנפרד, סיכום מתחת לכותרת */
.dpill{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:800;color:var(--muted);white-space:nowrap}
.lafter{font-size:18px;font-weight:700;color:var(--muted);margin-top:6px;line-height:1.4}
.lafter b{color:var(--text);font-weight:900;font-family:var(--round)}

/* שעון האימון */
.sess-t{font-size:14px;font-weight:700;color:var(--muted);margin-top:2px}
.sess-t .warn{color:var(--warn)}
.sess-b{display:flex;flex-direction:column;gap:6px}
.sess-b .btn{min-height:42px;padding:0 12px;font-size:15px}

/* אזורים רבים באימון: שורה נגללת עם שמות מלאים */
.wseg.many{display:flex;overflow-x:auto;scrollbar-width:none;gap:6px}
.wseg.many::-webkit-scrollbar{display:none}
.wseg.many a{flex:0 0 auto;min-width:86px;min-height:62px;padding:8px 16px 16px}
.wseg.many .n{overflow:visible;text-overflow:clip;max-width:none;font-size:17px}
.wseg.many .ok{top:6px;left:7px}

/* היסטוריה */
.msum{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 0;margin:2px 0 12px;font-size:15px;font-weight:700;color:var(--muted)}
.msum b{font-size:19px;color:var(--text)}
.msum .sep{width:1px;height:14px;background:var(--sep);margin:0 12px}
.cal2{padding:14px 10px 14px}
.c2-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 0;text-align:center}
.c2-head span{font:800 13px var(--round);color:var(--faint);padding-bottom:4px}
.c2{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--text);padding:2px 0}
.c2 .cn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:800 16px var(--round)}
.c2.w .cn{background:rgba(252,193,0,.16);color:var(--accent);font-weight:900}
.c2.today .cn{box-shadow:inset 0 0 0 2px var(--accent)}
.c2.fut .cn{color:var(--faint)}
.c2 .rd{width:5px;height:5px;border-radius:50%;background:transparent}
.c2 .rd.on{background:var(--warn)}
.hl{padding:8px 14px}
.hl-r{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) 52px 76px;align-items:center;min-height:48px;border-top:1px solid var(--sep);color:var(--text);text-decoration:none}
.hl-r > span{text-align:center}
.hl-r > .d{text-align:right}
.hl-r .d b{font-size:15px;font-weight:800}
.hl-r .tp{font-size:15px;font-weight:700;color:var(--muted);text-align:right}
.hl-r .n{font:800 16px var(--round)}
.hl-r .n small{font-size:12px;color:var(--faint);font-family:inherit}
.hl-r .na{color:var(--faint)}
.hl-r.td{background:rgba(252,193,0,.07);margin:0 -14px;padding:0 14px}
.hl-r.td b{color:var(--accent)}
.hl-h{min-height:30px;border-top:0;font-size:13px;font-weight:700;color:var(--faint)}
.hl-h > span{color:var(--faint)}
a.hl-r:active{background:var(--fill)}

/* ===================== 3.5 ===================== */
.ovr{display:flex;align-items:center;gap:12px;margin:-4px 0 14px;padding:12px 14px;border-radius:18px;background:var(--warn-tint);color:var(--warn);font-size:15px;font-weight:700;line-height:1.35}
.ovr .btn{flex-shrink:0}

/* ===================== 3.6 ===================== */
.htime{display:flex;align-items:center;gap:14px;margin:12px 0 4px;padding:14px 16px}
.htime .grow{display:flex;flex-direction:column;gap:2px}
.htime b{font-size:19px;font-weight:800}
.htime .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent);flex-shrink:0}

/* ---------- 4.0: המאמן ---------- */
.ctgt{align-items:flex-start;padding:12px 14px}
.ctgt svg{margin-top:2px}
.ctgt b{display:block;font-size:19px;font-weight:800;line-height:1.3}
.ctgt small{display:block;font-size:15px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.35}
.ctgt .ctag{font-style:normal;flex-shrink:0;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent);margin-top:2px}

async function fetchPaged(table, build, order) {

    order.forEach(o => { q = q.order(o); });
    const { data, error } = await q.range(from, from + size - 1);

    all = all.concat(data);
    if (data.length < size) break;
    from += size;
  }
  return all;
}

function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);

}
let lastRenderKey = '';
function render() {
  syncTemplates();
  const app = $('#app');
  if (!configured) { app.innerHTML = vSetup(); return; }
  if (!S.user) { app.innerHTML = vLogin(); updateSync(); return; }
  const r = S.route = parseRoute();
  const key = location.hash;
  const keep = {}; let focusId = null;
  if (key === lastRenderKey) {
    app.querySelectorAll('input[data-dirty="1"],textarea[data-dirty="1"]').forEach(el => { if (el.id) keep[el.id] = el.value; });
    if (document.activeElement && app.contains(document.activeElement)) focusId = document.activeElement.id;
  }
  let h;
  switch (r.name) {
    case 'workout': h = vWorkout(r.a); break;
    case 'pick': h = vPick(r.a); break;
    case 'm': h = vMachine(r.a); break;
    case 'sets': h = vSets(); break;
    case 'machines': h = vMachines(); break;
    case 'edit': h = vEdit(r.a || 'new', r.b); break;
    case 'history': h = vHistory(r.a, r.b); break;
    case 'ride': h = vRide(r.a); break;
    case 'settings': h = vSettings(r.a); break;
    case 'coach': h = vCoach(r.a, r.b); break;
    default: h = vToday();
  }
  app.innerHTML = h;
  for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el) { el.value = v; el.dataset.dirty = '1'; } }
  if (focusId) { const el = document.getElementById(focusId); if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) el.focus({ preventScroll: true }); }
  lastRenderKey = key;
  if (r.name !== 'edit') S.edit = null;
  if (r.name !== 'machines') S.reorder = false;
  if (r.name === 'ride') updateWattEstimate();
  if (r.name === 'm') centerStrip();
  if (r.name === 'coach') coachAfterRender();
  if (r.name === 'workout') { const w = $('.wseg.many'), o = w && w.querySelector('a.on'); if (o) { const a = w.getBoundingClientRect(), b = o.getBoundingClientRect(); w.scrollLeft += (b.left + b.width / 2) - (a.left + a.width / 2); } }

  updateSync(); updateWakeLock(); tick();
}

/* ---------- photos ---------- */
function compressImage(file, maxW = 900, q = 0.78) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.naturalWidth);
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => (b ? resolve(b) : reject(new Error('compress'))), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
    img.src = url;
  });
}

function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;

}

function cpDay(t = today()) {

function setSwap(date, from, to) {

/* ---------- ספינינג: 180 וואט, עלייה של 5 כל שבועיים ---------- */
const FEEL = [[1, 'קל'], [2, 'בינוני'], [3, 'קשה'], [4, 'מקסימום']];
function spinTarget(date = today()) {
  const c = S.settings.coach.spin, start = c.start || weekStartOf(date);
  let w = c.base, s = start;
  while (addDays(s, c.every) <= date) {
    const e = addDays(s, c.every - 1), rs = S.rides.filter(r => r.ride_date >= s && r.ride_date <= e && r.avg_watts);
    const met = rs.filter(r => r.avg_watts >= w - 3).length, hard = rs.filter(r => (r.feel || 0) >= 3).length;
    if (rs.length >= 4 && met >= Math.ceil(rs.length / 2) && hard <= rs.length / 2 && w < c.cap) w = Math.min(c.cap, w + c.step);
    s = addDays(s, c.every);
  }
  const last3 = S.rides.filter(r => r.ride_date < date).sort((a, b) => (a.ride_date < b.ride_date ? 1 : -1)).slice(0, 3);
  const strain = last3.length === 3 && last3.every(r => (r.feel || 0) >= 3 || (r.avg_watts && r.avg_watts < w - 3));
  return { w, next: addDays(s, c.every), cap: w >= c.cap, strain, min: 30 };
}
function spinWhy(sp) {
  if (sp.cap) return 'הגעת לכ 195 וואט, קרוב לסף שלך. כדאי לעשות מבחן של 20 דקות לפני שממשיכים לעלות';
  if (sp.strain) return 'שלוש רכיבות ברצף היו קשות או מתחת ליעד, ולכן היעד לא יעלה בבדיקה הקרובה';
  return `בדיקת עלייה הבאה ב ${shortDate(sp.next)}: אם רוב הרכיבות יעמדו ביעד וירגישו קל או בינוני, היעד יעלה ב ${S.settings.coach.spin.step} וואט`;
}

  return `<div class="sub sm ctgt-s">יעד: ${sp.min} דקות ב ${ltr(sp.w)} וואט ממוצע${res}</div>`;
