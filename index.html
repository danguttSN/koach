<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="כוח">
<meta name="robots" content="noindex, nofollow">
<title>כוח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{
  --a-back:#3E8BF0; --a-biceps:#D6409F; --a-chest:#E5484D; --a-triceps:#8E4EC6;
  --a-shoulders:#F76B15; --a-legs:#30A46C; --a-abs:#12A594;
  --primary:#F5C842; --on-primary:#1B1A10;
  --radius:16px; --nav-h:64px;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
:root,[data-theme="dark"]{
  --bg:#14171C; --surface:#1E232A; --surface2:#2A303A; --line:#363E4A;
  --text:#F2F0EA; --muted:#A7AFBC; --link:#F5C842;
  --ok:#3DD68C; --ok-bg:#173A2A; --warn:#FFA066; --warn-bg:#3D2617; --danger:#FF7A7A;
  --note-bg:#3A3220; --note:#F3DFA2;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F2F3F5; --surface:#FFFFFF; --surface2:#E8EBEF; --line:#D3D8DF;
  --text:#15181D; --muted:#525B68; --link:#7A5B00;
  --ok:#15803D; --ok-bg:#DCFCE7; --warn:#B4460B; --warn-bg:#FFEDD5; --danger:#C62828;
  --note-bg:#FEF3C7; --note:#713F12;
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  [data-theme="auto"]{
    --bg:#F2F3F5; --surface:#FFFFFF; --surface2:#E8EBEF; --line:#D3D8DF;
    --text:#15181D; --muted:#525B68; --link:#7A5B00;
    --ok:#15803D; --ok-bg:#DCFCE7; --warn:#B4460B; --warn-bg:#FFEDD5; --danger:#C62828;
    --note-bg:#FEF3C7; --note:#713F12;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Rubik,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.4;padding-top:var(--st);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 132px + var(--sb))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14px}
.sm{font-size:13px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.hidden{display:none!important}

.top{display:flex;align-items:center;gap:6px;min-height:60px;padding-top:12px;margin-bottom:6px}
.top h1{margin:0;font-size:27px;font-weight:800;line-height:1.15}
.top h1.sm{font-size:22px}
.iconbtn{width:48px;height:48px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--text);flex-shrink:0;text-decoration:none;margin-inline-start:-10px}
.h2{font-size:26px;font-weight:800;line-height:1.15}
.h3{font-size:17px;font-weight:700}
.section-title{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-title a,.link{font-size:15px;font-weight:500;color:var(--link);background:none;border:0;padding:8px 4px;min-height:44px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card + .card{margin-top:12px}
.stack > .card + .card,.stack-sm > .card + .card{margin-top:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{position:relative}
.btn{min-height:52px;border-radius:14px;border:0;padding:0 18px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-ghost{background:transparent;border:2px solid var(--line);color:var(--text)}
.btn-danger{background:transparent;border:2px solid var(--line);color:var(--danger)}
.btn-block{width:100%}
.btn-big{min-height:60px;font-size:19px}
.btn[disabled]{opacity:.6}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.neutral{background:var(--surface2);color:var(--muted)}
.note{background:var(--note-bg);color:var(--note);border-radius:12px;padding:10px 12px;font-size:15px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:15px;text-decoration:none;color:var(--text);flex-shrink:0}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.chip .ltr{opacity:.8}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;transition:width .3s}

.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--sb));padding-bottom:var(--sb);background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:20}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:12px}
.nav a.on{color:var(--text);font-weight:700}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:4px 0 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:12px;min-height:44px}
.wd .c{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;border:1px dashed var(--line);color:var(--muted)}
.wd.done .c{background:var(--text);color:var(--bg);border:0}
.wd.plan .c{border:1.5px solid var(--line);border-style:solid;color:var(--text)}
.wd.today{color:var(--text);font-weight:700}
.wd.today .c{border:2.5px solid var(--primary);color:var(--text)}
.wd.today.done .c{background:var(--text);color:var(--bg);box-shadow:0 0 0 3px var(--primary)}
.wd .rd{height:6px;width:6px;border-radius:50%;background:transparent}
.wd .rd.on{background:var(--primary)}

/* area progress */
.ap{display:grid;grid-template-columns:96px 1fr 58px;align-items:center;gap:10px;font-size:15px}
.ap .v{text-align:left;font-weight:700}
.ap .v.ok{color:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--text);min-height:112px}
.tile .big{font-size:30px;font-weight:800;line-height:1}
.tile.met{border-color:var(--ok)}

/* list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:64px;text-decoration:none;color:var(--text);border:0;background:transparent;width:100%;text-align:right}
.list .lrow + .lrow{border-top:1px solid var(--line)}
.lrow .t{font-size:16px;font-weight:700}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--surface2);flex-shrink:0;overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.chev{color:var(--muted);flex-shrink:0}

/* machine grid */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-decoration:none;color:var(--text);display:flex;flex-direction:column}
.mcard.done{opacity:.62}
.mphoto{position:relative;aspect-ratio:4/3;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.mphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mphoto .badge{position:absolute;top:8px;right:8px;background:var(--ok-bg);color:var(--ok);font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px}
.mbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.mname{font-size:16px;font-weight:700;line-height:1.25}

/* machine logging */
.hero{width:100%;height:170px;border-radius:var(--radius);overflow:hidden;background:var(--surface2);margin-bottom:12px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.setrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:right;color:var(--text)}
.setrow .n{width:44px;color:var(--muted);font-size:15px}
.setrow .w{flex:1;font-size:22px;font-weight:700}
.setrow .ck{width:30px;height:30px;border-radius:50%;background:var(--ok);color:var(--bg);display:grid;place-items:center}
.active{border:2px solid var(--primary)}
.stepper{display:flex;flex-direction:column;gap:6px}
.slabel{font-size:14px;color:var(--muted);text-align:center}
.srow{display:flex;align-items:center;gap:10px}
.sbtn{width:60px;height:60px;border-radius:50%;border:0;background:var(--surface2);color:var(--text);display:grid;place-items:center;flex-shrink:0}
.sbtn:active{transform:scale(.94)}
.sinput{flex:1;min-width:0;height:60px;text-align:center;font-size:42px;font-weight:800;background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:0}
.sinput:focus{outline:none;border-bottom-color:var(--primary)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:14px;font-weight:500;color:var(--muted)}
.input{height:52px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:17px;width:100%}
.input:focus{outline:none;border-color:var(--primary)}
.input::placeholder{color:var(--muted);opacity:.75}
.big-input{height:64px;font-size:30px;font-weight:700;text-align:left}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.photobox{height:180px;border-radius:var(--radius);background:var(--surface2);overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.photobox img{width:100%;height:100%;object-fit:cover;display:block}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.seg button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.mini{display:flex;align-items:center;gap:6px}
.mini button{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center}
.mini .val{min-width:58px;text-align:center;font-size:19px;font-weight:700}
.srow2{display:flex;align-items:center;gap:10px;min-height:60px;padding:6px 12px}
.list .srow2 + .srow2{border-top:1px solid var(--line)}
select.input{appearance:none;-webkit-appearance:none;height:44px;width:auto;min-width:120px;font-size:16px;padding:0 12px}
.toggle{position:relative;width:52px;height:32px;flex-shrink:0}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;border-radius:16px;background:var(--surface2);border:1px solid var(--line);transition:background .2s}
.toggle span::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.toggle input:checked + span{background:var(--primary)}
.toggle input:checked + span::after{transform:translateX(-20px);background:var(--on-primary)}
.toggle input:focus-visible + span{outline:3px solid var(--primary);outline-offset:2px}

/* fab */
.fab{position:fixed;bottom:calc(var(--nav-h) + var(--sb) + 14px);left:max(16px, calc(50% - 264px));z-index:15;min-height:56px;padding:0 20px;border-radius:28px;background:var(--primary);color:var(--on-primary);font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.28)}
body.has-timer .fab{bottom:calc(var(--nav-h) + var(--sb) + 100px)}

/* timer */
.tb{position:fixed;z-index:30;bottom:calc(var(--nav-h) + var(--sb) + 10px);left:50%;transform:translateX(-50%);width:min(536px, calc(100% - 24px));height:76px;border-radius:20px;background:var(--text);color:var(--bg);display:flex;align-items:center;gap:8px;padding:0 10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tb[hidden]{display:none}
.tb-main{flex:1;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:inherit;min-height:60px;text-align:right;padding:0}
.ring .trk{fill:none;stroke:currentColor;opacity:.2}
.ring .prg{fill:none;stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.tb-txt{display:flex;flex-direction:column;line-height:1.05}
.tb-lbl{font-size:13px;opacity:.75}
.tb-time{font-size:30px;font-weight:800}
.tb-btn{min-width:50px;height:50px;border-radius:12px;border:0;background:rgba(127,127,127,.22);color:inherit;font-size:15px;font-weight:700;padding:0 10px}
.tb.done{background:var(--primary);color:var(--on-primary)}
.tf{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;padding:calc(var(--st) + 16px) 20px calc(var(--sb) + 24px)}
.tf[hidden]{display:none}
.tf-top{align-self:stretch;display:flex;justify-content:space-between;align-items:center}
.tf-ring{position:relative;width:min(300px,78vw);aspect-ratio:1;margin-top:5vh;display:grid;place-items:center}
.tf-ring svg{position:absolute;inset:0;width:100%;height:100%}
.tf-ring .prg{stroke:var(--primary)}
.tf-time{font-size:min(96px,24vw);font-weight:800;line-height:1}
.tf-btns{display:flex;gap:14px;margin-top:32px}
.tf-btns button{width:100px;height:64px;border-radius:16px;border:0;background:var(--surface2);font-size:22px;font-weight:700}
.tf.done .tf-time{color:var(--primary)}

/* modal, toast, sync */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(var(--sb) + 20px);max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:21px}
.toast{position:fixed;z-index:70;top:calc(var(--st) + 12px);left:50%;transform:translateX(-50%) translateY(-20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sync{position:fixed;z-index:25;top:calc(var(--st) + 8px);left:12px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.sync[hidden]{display:none}

.login{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:8px;padding-bottom:40px}
.brand{font-size:64px;font-weight:800;letter-spacing:-1px;line-height:1}
.err{color:var(--danger);font-size:15px;min-height:22px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .btn{margin-top:12px}
.datebar{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px}
.datebar .mid{flex:1;text-align:center;position:relative}
.datebar input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:var(--surface2);border-radius:10px;padding:8px 10px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:21px;font-weight:800}
details.more summary{list-style:none;min-height:48px;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="empty" style="padding-top:40vh">טוען</div></div>

<div id="sync" class="sync" hidden role="status"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>

<div id="tb" class="tb" hidden>
  <button type="button" class="tb-main" data-a="tFull" aria-label="הצג טיימר במסך מלא">
    <svg class="ring" width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle class="trk" cx="26" cy="26" r="22" stroke-width="5"/><circle id="tbRing" class="prg" cx="26" cy="26" r="22" stroke-width="5" transform="rotate(-90 26 26)" stroke-dasharray="138.23" stroke-dashoffset="0"/></svg>
    <span class="tb-txt"><span class="tb-lbl" id="tbLbl">מנוחה</span><span class="tb-time num ltr" id="tbTime">2:00</span></span>
  </button>
  <button type="button" class="tb-btn" data-a="tAdd" data-d="15"><span class="ltr">+15</span></button>
  <button type="button" class="tb-btn" data-a="tAdd" data-d="-15"><span class="ltr">-15</span></button>
  <button type="button" class="tb-btn" data-a="tSkip">דלג</button>
</div>

<div id="tf" class="tf" hidden role="dialog" aria-label="טיימר מנוחה">
  <div class="tf-top">
    <div class="sub" id="tfName"></div>
    <button type="button" class="iconbtn" data-a="tClose" aria-label="סגור מסך מלא"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <div class="sub" style="font-size:20px;margin-top:4vh" id="tfLbl">מנוחה</div>
  <div class="tf-ring">
    <svg class="ring" viewBox="0 0 300 300" aria-hidden="true"><circle class="trk" cx="150" cy="150" r="134" stroke-width="16"/><circle id="tfRing" class="prg" cx="150" cy="150" r="134" stroke-width="16" transform="rotate(-90 150 150)" stroke-dasharray="841.95" stroke-dashoffset="0"/></svg>
    <div class="tf-time num ltr" id="tfTime">2:00</div>
  </div>
  <div class="tf-btns">
    <button type="button" data-a="tAdd" data-d="15"><span class="ltr">+15</span></button>
    <button type="button" data-a="tAdd" data-d="-15"><span class="ltr">-15</span></button>
  </div>
  <div style="flex:1"></div>
  <button type="button" class="btn btn-primary btn-big btn-block" style="max-width:520px" data-a="tSkip">דלג על המנוחה</button>
</div>

<noscript>כדי להשתמש באפליקציה צריך לאפשר JavaScript בדפדפן.</noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   כוח: יומן אימונים אישי
   ההגדרה היחידה שצריך לשנות: שני הערכים כאן למטה, מתוך Supabase.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://nbkwxghwfhiaeoyixvgu.supabase.co/rest/v1/',
  SUPABASE_KEY: 'sb_publishable_1IGU2ZkPCIdPKN6GxiGNSg_exDbUMGs'
};
/* ===================================================================== */

const BUCKET = 'machine-photos';
const CK = 'koach-cache-v1', QK = 'koach-queue-v1', TK = 'koach-timer-v1';

const AREAS = [
  { k:'back',      n:'גב',        c:'var(--a-back)' },
  { k:'biceps',    n:'יד קדמית',  c:'var(--a-biceps)' },
  { k:'chest',     n:'חזה',       c:'var(--a-chest)' },

  { k:'legs',      n:'רגליים',    c:'var(--a-legs)' },
  { k:'abs',       n:'בטן',       c:'var(--a-abs)' }
];
const AREA = Object.fromEntries(AREAS.map(a => [a.k, a]));
const TEMPLATES = { A:['back','biceps','abs'], B:['chest','triceps','shoulders','abs'], C:['legs','abs'] };
const TPL_NAME = { A:'א', B:'ב', C:'ג' };
const DAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

const DEFAULT_SETTINGS = {
  rest: 120,
  minSets: { back:9, biceps:9, chest:9, triceps:9, shoulders:9, legs:12, abs:9 },
  split: { '0':'A', '1':'B', '2':'A', '3':'B', '4':'C', '5':null, '6':null },

const CONFLICT = { sets:'id', machines:'id', rides:'id', workout_days:'user_id,workout_date', settings:'user_id' };

function svg(p, s = 24, w = 2) {

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const fmtDate = s => { const d = parseYmd(s); return `יום ${DAY_NAMES[d.getDay()]}, ${d.getDate()}.${d.getMonth() + 1}`; };
const shortDate = s => { const d = parseYmd(s); return `${d.getDate()}.${d.getMonth() + 1}`; };
const num = v => { if (v === null || v === undefined) return null; const s = String(v).trim().replace(',', '.'); if (s === '') return null; const n = parseFloat(s); return isFinite(n) ? n : null; };
const round2 = n => Math.round(n * 100) / 100;
const fmtW = w => { const n = Number(w) || 0; return Number.isInteger(n) ? String(n) : String(round2(n)); };
const ltr = s => `<span class="ltr num">${s}</span>`;
const fmtDur = sec => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${pad(s)}`; };
const fmtClock = ms => { const t = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; };
const setsTxt = n => n === 1 ? 'סט אחד' : `${n} סטים`;
const missTxt = n => n === 1 ? 'חסר סט אחד' : `חסרים ${n} סטים`;
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const areaName = k => AREA[k]?.n || k;
const areaColor = k => AREA[k]?.c || 'var(--muted)';
const setStr = s => `${fmtW(s.weight)}×${s.reps}`;

/* ---------- state ---------- */
const configured = !CONFIG.SUPABASE_URL.includes('YOUR-PROJECT') && !CONFIG.SUPABASE_KEY.includes('YOUR_KEY');
let sb = null;
const S = {
  user: null, loaded: false,
  machines: [], sets: [], days: {}, rides: [], settings: mergeSettings({}),
  maxByMachine: {}, photoUrls: {}, rangeStart: addDays(today(), -120),
  daySets: {}, dayLoading: {},
  queue: [], draft: {}, edit: null, mfilter: 'all', showArchived: false,
  timer: null, route: { name: 'today' }, prevHash: '', curHash: location.hash
};

function mergeSettings(d) {
  d = d || {};
  return { ...DEFAULT_SETTINGS, ...d,
    minSets: { ...DEFAULT_SETTINGS.minSets, ...(d.minSets || {}) },
    split: { ...DEFAULT_SETTINGS.split, ...(d.split || {}) } };
}
const normSet = s => ({ ...s, weight: Number(s.weight) || 0, reps: Number(s.reps) || 0 });
const normMachine = m => ({ ...m, min_weight: Number(m.min_weight) || 0, weight_step: Number(m.weight_step) || 5, default_sets: Number(m.default_sets) || 3 });
const normRide = r => ({ ...r, distance_km: r.distance_km == null ? null : Number(r.distance_km) });

/* ---------- derived data ---------- */
function setsOn(date) {
  if (date >= S.rangeStart) return S.sets.filter(s => s.workout_date === date);
  return S.daySets[date] || [];
}
const machineById = id => S.machines.find(m => m.id === id);
function sortSets(a) { return a.slice().sort((x, y) => String(x.created_at || '').localeCompare(String(y.created_at || ''))); }
function areaCountsOn(date) {
  const c = {}; AREAS.forEach(a => c[a.k] = 0);
  for (const s of setsOn(date)) { const m = machineById(s.machine_id); if (m) c[m.area]++; }
  return c;
}
function templateFor(date) {
  const t = S.days[date]?.template;
  if (t === 'R') return null;
  if (t && TEMPLATES[t]) return t;
  return S.settings.split[String(parseYmd(date).getDay())] || null;
}
function minFor(area, date) {
  const t = templateFor(date);
  return t && TEMPLATES[t].includes(area) ? S.settings.minSets[area] : null;
}
function prevSession(mid, before) {
  let best = null;
  for (const s of S.sets) if (s.machine_id === mid && s.workout_date < before && (!best || s.workout_date > best)) best = s.workout_date;
  if (!best) return null;
  return { date: best, sets: sortSets(S.sets.filter(s => s.machine_id === mid && s.workout_date === best)) };
}
function machineMax(mid, excludeId) {
  let mx = S.maxByMachine[mid] ?? 0;
  for (const s of S.sets) if (s.machine_id === mid && s.id !== excludeId && s.weight > mx) mx = s.weight;
  return mx;
}
function hasHistory(mid) { return S.maxByMachine[mid] != null || S.sets.some(s => s.machine_id === mid); }
const rideOn = date => S.rides.find(r => r.ride_date === date) || null;
function daysForArea(a) {
  const l = [];
  for (let i = 0; i < 7; i++) { const t = S.settings.split[String(i)]; if (t && TEMPLATES[t].includes(a)) l.push(DAY_LETTERS[i]); }
  return l.length ? `ימים ${l.join(', ')}` : 'לא בחלוקה';
}
function lastDateForArea(a, before) {
  let best = null;
  for (const s of S.sets) { if (s.workout_date >= before) continue; const m = machineById(s.machine_id); if (m && m.area === a && (!best || s.workout_date > best)) best = s.workout_date; }
  return best;
}
function photoUrl(m) { return m && m.photo_path ? S.photoUrls[m.photo_path]?.url || null : null; }
function photoHtml(m, size = 22) {
  const u = photoUrl(m);
  return u ? `<img src="${esc(u)}" alt="" loading="lazy" decoding="async">` : svg(I.image, size, 1.7);
}

/* ---------- persistence: cache, queue ---------- */
let cacheT = null;
function saveCache() {
  clearTimeout(cacheT);
  cacheT = setTimeout(() => {
    try {
      localStorage.setItem(CK, JSON.stringify({ uid: S.user?.id, machines: S.machines, sets: S.sets, days: S.days, rides: S.rides,
        settings: S.settings, maxByMachine: S.maxByMachine, photoUrls: S.photoUrls, rangeStart: S.rangeStart }));
    } catch (e) {}
  }, 250);
}
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CK) || 'null');
    if (c && c.uid === S.user?.id) {
      Object.assign(S, { machines: c.machines || [], sets: c.sets || [], days: c.days || {}, rides: c.rides || [],
        settings: mergeSettings(c.settings?.minSets ? c.settings : {}), maxByMachine: c.maxByMachine || {}, photoUrls: c.photoUrls || {},
        rangeStart: c.rangeStart || S.rangeStart });
      S.loaded = true;
    }
    const q = JSON.parse(localStorage.getItem(QK) || '[]');
    S.queue = q.filter(o => o.uid === S.user?.id);
    S.queue.forEach(applyLocal);
    const t = JSON.parse(localStorage.getItem(TK) || 'null');
    if (t && t.end > Date.now() - 6000) S.timer = t;
  } catch (e) {}
  applyTheme();
}
function saveQueue() { try { localStorage.setItem(QK, JSON.stringify(S.queue)); } catch (e) {} }

function applyLocal(op) {
  const t = op.table;
  if (t === 'settings') { S.settings = mergeSettings(op.row.data); return; }
  if (t === 'workout_days') {
    if (op.op === 'upsert') S.days[op.row.workout_date] = { ...(S.days[op.row.workout_date] || {}), ...op.row };
    return;
  }
  const arr = t === 'sets' ? S.sets : t === 'machines' ? S.machines : t === 'rides' ? S.rides : null;
  if (!arr) return;
  const id = op.op === 'delete' ? op.id : op.row.id;
  const i = arr.findIndex(x => x.id === id);
  if (op.op === 'delete') { if (i >= 0) arr.splice(i, 1); }
  else {
    const row = t === 'sets' ? normSet(op.row) : t === 'machines' ? normMachine(op.row) : t === 'rides' ? normRide(op.row) : op.row;
    if (i >= 0) arr[i] = { ...arr[i], ...row }; else arr.push(row);
  }
}
function enqueue(op) {
  op.qid = uuid(); op.uid = S.user.id;
  if (op.table === 'settings') S.queue = S.queue.filter(o => o.table !== 'settings');
  applyLocal(op);
  S.queue.push(op);
  saveQueue(); saveCache(); flushSoon(); updateSync();
}
let flushing = false, flushT = null;
function flushSoon(ms = 150) { clearTimeout(flushT); flushT = setTimeout(flush, ms); }
async function flush() {
  if (flushing || !S.user || !S.queue.length) { updateSync(); return; }
  flushing = true;
  try {
    while (S.queue.length) {
      const op = S.queue[0];
      let res;
      try {
        res = op.op === 'delete'
          ? await sb.from(op.table).delete().eq('id', op.id)
          : await sb.from(op.table).upsert(op.row, { onConflict: CONFLICT[op.table] });
      } catch (e) { break; }
      if (res.error) {
        if (!res.error.code) break;           /* בעיית רשת: ננסה שוב אחר כך */
        console.error(res.error);
        toast('השמירה בשרת נכשלה: ' + res.error.message, 5000);
      }
      S.queue.shift(); saveQueue();
    }
  } finally { flushing = false; updateSync(); }
}
function updateSync() {
  const el = $('#sync'); if (!el) return;
  const n = S.queue.length;
  if (!S.user) { el.hidden = true; return; }
  if (!navigator.onLine) { el.hidden = false; el.textContent = n ? `לא מחובר, ${n} ממתינים` : 'לא מחובר'; }
  else if (n) { el.hidden = false; el.textContent = `שומר ${n}`; }
  else el.hidden = true;
}

/* ---------- server fetch ---------- */
async function fetchPaged(table, build, order) {
  let all = [], from = 0; const size = 1000;
  for (;;) {
    let q = build(sb.from(table).select('*'));
    order.forEach(o => { q = q.order(o); });
    const { data, error } = await q.range(from, from + size - 1);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < size) break;
    from += size;
  }
  return all;
}
async function fetchAll() {
  if (!S.user) return;
  const since = addDays(today(), -120);
  try {
    const [m, d, r, st, mx, sets] = await Promise.all([
      sb.from('machines').select('*').order('sort_order').order('name'),
      sb.from('workout_days').select('*').gte('workout_date', since),
      sb.from('rides').select('*').gte('ride_date', addDays(today(), -400)).order('ride_date'),
      sb.from('settings').select('*').maybeSingle(),
      sb.from('machine_max').select('*'),
      fetchPaged('sets', q => q.gte('workout_date', since), ['workout_date', 'created_at'])
    ]);
    for (const x of [m, d, r, st, mx]) if (x.error) throw x.error;
    S.machines = m.data.map(normMachine);
    S.days = {}; d.data.forEach(x => { S.days[x.workout_date] = x; });
    S.rides = r.data.map(normRide);
    S.settings = mergeSettings(st.data?.data);
    S.maxByMachine = {}; mx.data.forEach(x => { S.maxByMachine[x.machine_id] = Number(x.max_weight) || 0; });
    S.sets = sets.map(normSet);
    S.rangeStart = since;
    S.queue.forEach(applyLocal);
    S.loaded = true;
    applyTheme(); saveCache(); render();
    refreshPhotos();
  } catch (e) {
    console.error(e);
    if (navigator.onLine) toast(e.code === '42501' ? 'אין הרשאה לטבלאות. צריך להריץ שוב את קובץ ה SQL' : 'טעינת הנתונים מהשרת נכשלה', 5000);
    if (!S.loaded) { S.loaded = true; render(); }
  }
}
async function refreshPhotos() {
  const now = Date.now();
  const need = [...new Set(S.machines.filter(m => m.photo_path && (!S.photoUrls[m.photo_path] || S.photoUrls[m.photo_path].exp < now + 36e5)).map(m => m.photo_path))];
  if (!need.length) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need, 60 * 60 * 24 * 7);
  if (error || !data) return;
  data.forEach(x => { if (x.signedUrl && x.path) S.photoUrls[x.path] = { url: x.signedUrl, exp: now + 7 * 864e5 }; });
  saveCache(); render();
}
async function fetchDay(date) {
  if (S.dayLoading[date]) return;
  S.dayLoading[date] = true;
  const [a, b] = await Promise.all([
    sb.from('sets').select('*').eq('workout_date', date).order('created_at'),
    sb.from('workout_days').select('*').eq('workout_date', date).maybeSingle()
  ]);
  S.daySets[date] = a.error ? [] : a.data.map(normSet);
  if (!b.error && b.data) S.days[date] = b.data;
  S.dayLoading[date] = false;
  render();
}

function stepper(id, label, val, st, opts = {}) {

    <input id="${id}" class="sinput num" dir="ltr" inputmode="${opts.int ? 'numeric' : 'decimal'}" value="${fmtW(val)}" ${opts.draft ? `data-draft="${opts.draft}"` : ''} autocomplete="off" enterkeyhint="done">
    <button type="button" class="sbtn" data-a="step" data-t="${id}" data-st="${st}" data-d="-1" aria-label="הפחת מ${label}">${svg(I.minus, 28, 2.6)}</button>
  </div></div>`;

function areaProgress(a, c, min) {
  const pct = min ? Math.min(100, Math.round(c / min * 100)) : 0;
  const met = min && c >= min;
  return `<div class="ap"><span class="row" style="gap:8px"><span class="dot" style="background:${areaColor(a)}"></span>${areaName(a)}</span>
    <div class="bar"><i style="width:${pct}%;background:${areaColor(a)}"></i></div>
    <span class="v num ${met ? 'ok' : ''}"><span class="ltr">${c}/${min}</span></span></div>`;
}
function rideSummary(r) {
  const parts = [ltr(fmtDur(r.duration_sec))];
  if (r.distance_km != null) parts.push(`${ltr(fmtW(r.distance_km))} ק״מ`);
  if (r.calories != null) parts.push(`${ltr(r.calories)} קלוריות`);
  if (r.avg_watts != null) parts.push(`${ltr(r.avg_watts)} וואט${r.watts_estimated ? ' משוער' : ''}`);
  return parts.join(', ');
}

function weekStrip(t) {
  const start = addDays(t, -parseYmd(t).getDay());
  let h = '<div class="week" role="list" aria-label="השבוע">';
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i), has = setsOn(d).length > 0, isT = d === t, plan = templateFor(d);
    const cls = ['wd', has ? 'done' : '', isT ? 'today' : '', !has && plan ? 'plan' : ''].join(' ');
    const letter = has || plan ? TPL_NAME[(S.days[d]?.template && TEMPLATES[S.days[d].template]) ? S.days[d].template : plan] || '' : '';
    const inner = `<span>${DAY_LETTERS[i]}</span><span class="c">${has && !letter ? svg(I.check, 16, 3) : letter}</span><span class="rd ${rideOn(d) ? 'on' : ''}"></span>`;
    const label = `${fmtDate(d)}${has ? ', בוצע אימון' : ''}${rideOn(d) ? ', רכיבה' : ''}`;
    h += d <= t ? `<a role="listitem" class="${cls}" href="#/history/${d}" aria-label="${label}">${inner}</a>` : `<div role="listitem" class="${cls}" aria-label="${label}">${inner}</div>`;
  }

function vPick(area) {

function nextDefaults(m, ts, prev) {

/* ---------- router & render ---------- */
function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  return { name: parts[0] || 'today', a: parts[1], b: parts[2] };
}
let lastRenderKey = '';
function render() {
  const app = $('#app');
  if (!configured) { app.innerHTML = vSetup(); return; }
  if (!S.user) { app.innerHTML = vLogin(); updateSync(); return; }
  const r = S.route = parseRoute();
  const key = location.hash;
  const keep = {}; let focusId = null;
  if (key === lastRenderKey) {
    app.querySelectorAll('input[data-dirty="1"]').forEach(el => { if (el.id) keep[el.id] = el.value; });
    if (document.activeElement && app.contains(document.activeElement)) focusId = document.activeElement.id;
  }
  let h;
  switch (r.name) {
    case 'workout': h = vWorkout(); break;
    case 'pick': h = vPick(r.a); break;
    case 'm': h = vMachine(r.a); break;
    case 'sets': h = vSets(); break;
    case 'machines': h = vMachines(); break;
    case 'edit': h = vEdit(r.a || 'new', r.b); break;
    case 'history': h = vHistory(r.a, r.b); break;
    case 'ride': h = vRide(r.a); break;
    case 'settings': h = vSettings(); break;
    default: h = vToday();
  }
  app.innerHTML = h;
  for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el) { el.value = v; el.dataset.dirty = '1'; } }
  if (focusId) { const el = document.getElementById(focusId); if (el && el.tagName === 'INPUT') el.focus({ preventScroll: true }); }
  lastRenderKey = key;
  if (r.name !== 'edit') S.edit = null;
  if (r.name === 'ride') updateWattEstimate();
  updateSync(); updateWakeLock(); tick();
}

/* ---------- timer ---------- */
let actx = null;
function ensureAudio() {
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}
function beep() {
  if (!S.settings.sound || !actx) return;
  try {
    [0, 0.25].forEach(off => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      const t0 = actx.currentTime + off; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18); o.start(t0); o.stop(t0 + 0.2); });
  } catch (e) {}
}
function startTimer(sec, name) {
  const s = sec ?? S.settings.rest;
  S.timer = { end: Date.now() + s * 1000, total: s, notified: false, name: name || '' };
  localStorage.setItem(TK, JSON.stringify(S.timer));
  tick();
}
function stopTimer() { S.timer = null; localStorage.removeItem(TK); $('#tf').hidden = true; tick(); }
function tick() {
  const el = document.getElementById('elapsed');
  if (el) { const st = S.days[today()]?.started_at; el.textContent = st ? fmtClock(Date.now() - Date.parse(st)) : ''; }
  const tb = $('#tb'), tf = $('#tf');
  if (!S.timer || !S.user) { tb.hidden = true; document.body.classList.remove('has-timer'); return; }
  const rem = Math.max(0, S.timer.end - Date.now()), frac = S.timer.total ? rem / (S.timer.total * 1000) : 0;
  const txt = fmtDur(Math.ceil(rem / 1000));
  tb.hidden = false; document.body.classList.add('has-timer');
  $('#tbTime').textContent = txt; $('#tfTime').textContent = txt;
  $('#tbRing').setAttribute('stroke-dashoffset', String(138.23 * (1 - frac)));
  $('#tfRing').setAttribute('stroke-dashoffset', String(841.95 * (1 - frac)));
  $('#tfName').textContent = S.timer.name || '';
  if (rem <= 0) {
    tb.classList.add('done'); tf.classList.add('done');
    $('#tbLbl').textContent = 'המנוחה נגמרה'; $('#tfLbl').textContent = 'המנוחה נגמרה';
    if (!S.timer.notified) {
      S.timer.notified = true; localStorage.setItem(TK, JSON.stringify(S.timer));
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      beep();
      const end = S.timer.end;
      setTimeout(() => { if (S.timer && S.timer.end === end) stopTimer(); }, 5000);
    }
  } else {
    tb.classList.remove('done'); tf.classList.remove('done');
    $('#tbLbl').textContent = 'מנוחה'; $('#tfLbl').textContent = 'מנוחה';
  }
}

/* ---------- wake lock ---------- */
let wl = null;
async function updateWakeLock() {
  const want = S.user && S.settings.wakeLock && ['workout', 'm', 'pick', 'sets'].includes(S.route.name) && document.visibilityState === 'visible';
  try {
    if (want && !wl && 'wakeLock' in navigator) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); }
    else if (!want && wl) { await wl.release(); wl = null; }
  } catch (e) { wl = null; }
}

function compressImage(file, maxW = 900, q = 0.78) {

    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.naturalWidth);
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => (b ? resolve(b) : reject(new Error('compress'))), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
    img.src = url;
  });
}

/* ---------- export ---------- */
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function fetchEverything() {
  const all = (t, o) => fetchPaged(t, q => q, o);
  const [machines, sets, workout_days, rides] = await Promise.all([all('machines', ['created_at']), all('sets', ['workout_date', 'created_at']), all('workout_days', ['workout_date']), all('rides', ['ride_date'])]);
  return { machines, sets, workout_days, rides };
}

/* ---------- actions ---------- */
const A = {
  start(el) {
    const t = today(), tpl = el.dataset.t || templateFor(t);
    if (!tpl) return;
    const day = S.days[t] || {};
    const row = { user_id: S.user.id, workout_date: t, template: tpl };
    if (!day.started_at) row.started_at = new Date().toISOString();
    if (day.finished_at) row.finished_at = null;
    enqueue({ table: 'workout_days', op: 'upsert', row });
    go('#/workout');
  },
  switchTpl() {
    const cur = templateFor(today());
    openModal(`<h2>איזה אימון היום?</h2><div class="stack-sm">${Object.keys(TEMPLATES).map(k => `<button class="btn ${k === cur ? 'btn-primary' : 'btn-ghost'} btn-block" data-a="setTpl" data-t="${k}">אימון ${TPL_NAME[k]}: ${TEMPLATES[k].map(areaName).join(', ')}</button>`).join('')}
      <button class="btn btn-ghost btn-block" data-a="setTpl" data-t="R">יום מנוחה</button><button class="link" style="align-self:center" data-a="closeModal">ביטול</button></div>`);
  },
  setTpl(el) {
    enqueue({ table: 'workout_days', op: 'upsert', row: { user_id: S.user.id, workout_date: today(), template: el.dataset.t } });
    closeModal(); render();
  },
  closeModal() { closeModal(); },
  finish() {
    const t = today(), tpl = templateFor(t), counts = areaCountsOn(t), sets = setsOn(t), day = S.days[t] || {};
    const prs = sets.filter(s => s.is_pr).length;
    const dur = day.started_at ? fmtClock(Date.now() - Date.parse(day.started_at)) : null;
    openModal(`<h2>סיום אימון${tpl ? ' ' + TPL_NAME[tpl] : ''}</h2>
      <div class="stats3" style="margin-bottom:12px"><div class="stat"><div class="k">סטים</div><div class="v num">${sets.length}</div></div>
        <div class="stat"><div class="k">משך</div><div class="v ltr num" style="font-size:18px">${dur || '-'}</div></div>
        <div class="stat"><div class="k">שיאים חדשים</div><div class="v num">${prs}</div></div></div>
      ${tpl ? `<div class="stack-sm" style="margin-bottom:14px">${TEMPLATES[tpl].map(a => areaProgress(a, counts[a], S.settings.minSets[a])).join('')}</div>` : ''}
      <div class="flabel" style="margin-bottom:6px">נתוני שעון, רשות</div>
      <div class="grid3" style="margin-bottom:16px">
        <div class="field"><label for="whr" class="sub sm">דופק ממוצע</label><input class="input num" id="whr" inputmode="numeric" dir="ltr" value="${day.avg_hr ?? ''}"></div>
        <div class="field"><label for="whrm" class="sub sm">דופק מרבי</label><input class="input num" id="whrm" inputmode="numeric" dir="ltr" value="${day.max_hr ?? ''}"></div>
        <div class="field"><label for="wkc" class="sub sm">קלוריות שעון</label><input class="input num" id="wkc" inputmode="numeric" dir="ltr" value="${day.watch_kcal ?? ''}"></div></div>
      <button class="btn btn-primary btn-big btn-block" data-a="finishSave">שמור וסיים</button>
      <button class="btn btn-ghost btn-block" style="margin-top:10px" data-a="closeModal">חזרה לאימון</button>`);
  },
  finishSave() {
    const t = today(), day = S.days[t] || {};
    const iv = id => { const v = num($('#' + id).value); return v == null ? null : Math.round(v); };
    enqueue({ table: 'workout_days', op: 'upsert', row: { user_id: S.user.id, workout_date: t, template: templateFor(t), started_at: day.started_at || new Date().toISOString(), finished_at: new Date().toISOString(), avg_hr: iv('whr'), max_hr: iv('whrm'), watch_kcal: iv('wkc') } });
    closeModal(); stopTimer(); toast('האימון נשמר'); go('#/');
  },
  step(el) {
    const inp = document.getElementById(el.dataset.t); if (!inp) return;
    const st = parseFloat(el.dataset.st) || 1, d = parseInt(el.dataset.d, 10);
    const v = Math.max(0, round2((num(inp.value) || 0) + d * st));
    inp.value = fmtW(v); inp.dataset.dirty = '1';
    if (inp.dataset.draft && S.draft[S.route.a]) S.draft[S.route.a][inp.dataset.draft] = v;
  },
  saveSet(el) {
    ensureAudio();
    const id = el.dataset.id, m = machineById(id); if (!m) return;
    const w = Math.max(0, num($('#dw').value) || 0), r = Math.round(num($('#dr').value) || 0);
    if (r <= 0) { toast('הזן מספר חזרות'); $('#dr').focus(); return; }
    const isPr = hasHistory(id) && w > machineMax(id);
    const t = today(), day = S.days[t] || {};
    enqueue({ table: 'sets', op: 'upsert', row: { id: uuid(), user_id: S.user.id, machine_id: id, workout_date: t, weight: w, reps: r, is_pr: isPr, created_at: new Date().toISOString() } });
    if (!day.started_at || !day.template) enqueue({ table: 'workout_days', op: 'upsert', row: { user_id: S.user.id, workout_date: t, template: day.template || templateFor(t) || null, started_at: day.started_at || new Date().toISOString() } });
    delete S.draft[id];
    document.querySelectorAll('#app [data-dirty]').forEach(x => { delete x.dataset.dirty; });
    startTimer(undefined, m.name);
    if (isPr) toast(`שיא חדש ב${m.name}: ${fmtW(w)} ק״ג`, 3500);
    const c = areaCountsOn(t)[m.area], min = S.settings.minSets[m.area];
    if (c === min && minFor(m.area, t) != null) toast(`עמדת ביעד של ${areaName(m.area)}: ${min} סטים`, 3500);
    render();
  },
  editSet(el) {
    const s = S.sets.find(x => x.id === el.dataset.id); if (!s) return;
    const m = machineById(s.machine_id);
    openModal(`<h2>עריכת סט</h2><div class="stack">${stepper('ew', 'משקל, ק״ג', s.weight, m?.weight_step || 2.5)}${stepper('er', 'חזרות', s.reps, 1, { int: true })}
      <button class="btn btn-primary btn-block" data-a="updSet" data-id="${s.id}">שמור שינוי</button>
      <button class="btn btn-danger btn-block" data-a="delSet" data-id="${s.id}">${svg(I.trash, 20)}מחק את הסט</button>
      <button class="link" style="align-self:center" data-a="closeModal">ביטול</button></div>`);
  },
  updSet(el) {
    const s = S.sets.find(x => x.id === el.dataset.id); if (!s) return;
    const w = Math.max(0, num($('#ew').value) || 0), r = Math.round(num($('#er').value) || 0);
    if (r <= 0) { toast('הזן מספר חזרות'); return; }
    enqueue({ table: 'sets', op: 'upsert', row: { ...s, weight: w, reps: r } });
    closeModal(); render();
  },
  delSet(el) { enqueue({ table: 'sets', op: 'delete', id: el.dataset.id }); closeModal(); toast('הסט נמחק'); render(); },
  mfilter(el) { S.mfilter = el.dataset.k; render(); },
  toggleArch() { S.showArchived = !S.showArchived; render(); },
  farea(el) {
    S.edit.area = el.dataset.k;
    document.querySelectorAll('[data-a="farea"]').forEach(b => { const on = b.dataset.k === S.edit.area; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    $('#fhint').textContent = tplHint(S.edit.area);
  },
  fstep(el) {
    S.edit.step = parseFloat(el.dataset.v);
    document.querySelectorAll('[data-a="fstep"]').forEach(b => { const on = parseFloat(b.dataset.v) === S.edit.step; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    document.querySelectorAll('[data-t="fmin"]').forEach(b => { b.dataset.st = S.edit.step; });
  },
  async saveMachine(el) {
    const E = S.edit; if (!E) return;
    const name = $('#fname').value.trim();
    if (!name) { toast('הזן שם למכשיר'); $('#fname').focus(); return; }
    if (!E.area) { toast('בחר אזור בגוף'); return; }
    const old = E.isNew ? null : machineById(E.id);
    let photo_path = old?.photo_path || null;
    if (E.blob) {
      el.disabled = true; el.textContent = 'מעלה תמונה';
      const path = `${S.user.id}/${E.id}-${Date.now()}.jpg`;
      const { error } = await sb.storage.from(BUCKET).upload(path, E.blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: true });
      if (error) { toast('העלאת התמונה נכשלה, המכשיר נשמר בלי התמונה החדשה', 4500); }
      else {
        if (photo_path) sb.storage.from(BUCKET).remove([photo_path]);
        photo_path = path;
        S.photoUrls[path] = { url: E.preview, exp: 0 };
      }
    }
    const row = { id: E.id, user_id: S.user.id, name, area: E.area, min_weight: Math.max(0, num($('#fmin').value) || 0), weight_step: E.step,
      default_sets: Math.max(1, Math.round(num($('#fsets').value) || 3)), note: $('#fnote').value.trim() || null, photo_path,
      sort_order: old?.sort_order ?? S.machines.length, archived: old?.archived ?? false };
    enqueue({ table: 'machines', op: 'upsert', row });
    S.edit = null; toast('המכשיר נשמר');
    const back = S.prevHash && !S.prevHash.startsWith('#/edit') ? S.prevHash : '#/machines';
    go(back);
    refreshPhotos();
  },
  archive() {
    const m = machineById(S.edit?.id); if (!m) return;
    enqueue({ table: 'machines', op: 'upsert', row: { ...m, archived: !m.archived } });
    toast(m.archived ? 'המכשיר הוחזר' : 'המכשיר הועבר לארכיון'); S.edit = null; go('#/machines');
  },
  saveRide(el) {
    const date = el.dataset.date, r = rideOn(date), p = lastRideBefore(date);
    const sec = rideDuration(date);
    if (!sec) { toast('הזן את זמן הרכיבה'); $('#rmin').focus(); return; }
    const cal = rideFieldVal('rcal', p?.calories);
    let watts = num($('#rwatt').value), est = false;
    if (watts == null && cal && sec) { watts = Math.round(cal * 1000 / sec); est = true; }
    const iv = id => { const v = num($('#' + id).value); return v == null ? null : Math.round(v); };
    const bike = $('#rbike').value.trim() || p?.bike_no || null;
    enqueue({ table: 'rides', op: 'upsert', row: { id: r?.id || uuid(), user_id: S.user.id, ride_date: date, duration_sec: sec,
      distance_km: rideFieldVal('rdist', p?.distance_km), calories: cal == null ? null : Math.round(cal), avg_watts: watts == null ? null : Math.round(watts),
      watts_estimated: est, bike_no: bike, avg_hr: iv('rhr'), max_hr: iv('rhrm'), watch_kcal: iv('rwk') } });
    toast('הרכיבה נשמרה'); go(date === today() ? '#/' : '#/history/' + date);
  },
  delRide(el) {
    openModal(`<h2>למחוק את הרכיבה?</h2><div class="stack-sm"><button class="btn btn-danger btn-block" data-a="delRideYes" data-id="${el.dataset.id}">כן, מחק</button><button class="btn btn-ghost btn-block" data-a="closeModal">ביטול</button></div>`);
  },
  delRideYes(el) { enqueue({ table: 'rides', op: 'delete', id: el.dataset.id }); closeModal(); toast('הרכיבה נמחקה'); go('#/'); },
  sStep(el) {
    const k = el.dataset.k, d = parseInt(el.dataset.d, 10);
    if (k === 'rest') S.settings.rest = Math.min(600, Math.max(15, S.settings.rest + d * 15));
    else if (k.startsWith('min.')) { const a = k.slice(4); S.settings.minSets[a] = Math.min(40, Math.max(1, S.settings.minSets[a] + d)); }
    saveSettings(); render();
  },
  tFull() { $('#tf').hidden = false; },
  tClose() { $('#tf').hidden = true; },
  tAdd(el) {
    if (!S.timer) return;
    const d = parseInt(el.dataset.d, 10) * 1000;
    const base = Math.max(Date.now(), S.timer.end);
    S.timer.end = Math.max(Date.now() + 1000, base + d); S.timer.total = Math.max(S.timer.total, Math.ceil((S.timer.end - Date.now()) / 1000));
    S.timer.notified = false; localStorage.setItem(TK, JSON.stringify(S.timer)); tick();
  },
  tSkip() { stopTimer(); },
  async exportJson(el) {
    el.disabled = true; el.textContent = 'מכין קובץ';
    try { const all = await fetchEverything(); download(new Blob([JSON.stringify({ exported_at: new Date().toISOString(), settings: S.settings, ...all }, null, 2)], { type: 'application/json' }), `koach-backup-${today()}.json`); toast('הגיבוי ירד'); }
    catch (e) { toast('הייצוא נכשל. בדוק חיבור לאינטרנט'); }
    render();
  },
  async exportCsv(el) {
    el.disabled = true; el.textContent = 'מכין קובץ';
    try {
      const all = await fetchEverything(), mm = Object.fromEntries(all.machines.map(m => [m.id, m]));
      const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lines = [['תאריך', 'אזור', 'מכשיר', 'משקל', 'חזרות', 'שיא'].map(q).join(',')];
      all.sets.forEach(s => { const m = mm[s.machine_id]; lines.push([s.workout_date, areaName(m?.area), m?.name, s.weight, s.reps, s.is_pr ? 'כן' : ''].map(q).join(',')); });
      download(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), `koach-sets-${today()}.csv`); toast('הקובץ ירד');
    } catch (e) { toast('הייצוא נכשל. בדוק חיבור לאינטרנט'); }
    render();
  },
  refresh() { toast('מרענן'); flush().then(fetchAll); },
  signOut() {
    openModal(`<h2>להתנתק?</h2>${S.queue.length ? `<p class="err">יש ${S.queue.length} פעולות שעוד לא נשמרו בשרת. התנתקות עכשיו תמחק אותן.</p>` : '<p class="sub">הנתונים שמורים בשרת. בפעם הבאה תצטרך להיכנס עם אימייל וסיסמה.</p>'}
      <div class="stack-sm"><button class="btn btn-danger btn-block" data-a="signOutYes">התנתק</button><button class="btn btn-ghost btn-block" data-a="closeModal">ביטול</button></div>`);
  },
  async signOutYes() { closeModal(); await sb.auth.signOut(); }
};

let settingsT = null;
function saveSettings() {
  applyTheme();
  clearTimeout(settingsT);
  settingsT = setTimeout(() => enqueue({ table: 'settings', op: 'upsert', row: { user_id: S.user.id, data: S.settings, updated_at: new Date().toISOString() } }), 500);
}
function applyTheme() {
  const t = S.settings.theme || 'dark';
  document.documentElement.dataset.theme = t;
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('meta[name="theme-color"]').setAttribute('content', dark ? '#14171C' : '#F2F3F5');
}
function resetState() {
  Object.assign(S, { machines: [], sets: [], days: {}, rides: [], settings: mergeSettings({}), maxByMachine: {}, photoUrls: {}, daySets: {}, queue: [], draft: {}, edit: null, timer: null, loaded: false });
  try { localStorage.removeItem(CK); localStorage.removeItem(QK); localStorage.removeItem(TK); } catch (e) {}
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) { e.preventDefault(); A[el.dataset.a](el, e); return; }
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest('#app') && t.tagName === 'INPUT') t.dataset.dirty = '1';
  if (t.dataset.draft && S.draft[S.route.a]) { const v = num(t.value); if (v != null) S.draft[S.route.a][t.dataset.draft] = v; }
  if (['rmin', 'rsec', 'rcal', 'rwatt'].includes(t.id)) updateWattEstimate();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.s) {
    const k = t.dataset.s;
    if (k === 'split') S.settings.split[t.dataset.dow] = t.value || null;
    else if (k === 'theme') S.settings.theme = t.value;
    else if (k === 'wakeLock' || k === 'sound') S.settings[k] = t.checked;
    saveSettings(); render(); return;
  }
  if (t.id === 'hdate' && isDate(t.value)) { go(`#/history/${t.value}${t.dataset.area ? '/' + t.dataset.area : ''}`); return; }
  if (t.hasAttribute('data-photo') && t.files && t.files[0] && S.edit) {
    try {
      const blob = await compressImage(t.files[0]);
      if (S.edit.preview) URL.revokeObjectURL(S.edit.preview);
      S.edit.blob = blob; S.edit.preview = URL.createObjectURL(blob);
      $('#fphoto').innerHTML = `<img src="${S.edit.preview}" alt="תמונת המכשיר">`;
    } catch (err) { toast('לא הצלחתי לקרוא את התמונה'); }
    t.value = '';
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  const email = $('#lemail').value.trim(), password = $('#lpass').value, btn = $('#lbtn'), err = $('#lerr');
  if (!email || !password) { err.textContent = 'הזן אימייל וסיסמה'; return; }
  btn.disabled = true; btn.textContent = 'נכנס'; err.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { err.textContent = /invalid/i.test(error.message) ? 'האימייל או הסיסמה שגויים' : error.message; btn.disabled = false; btn.textContent = 'כניסה'; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (!$('#tf').hidden) $('#tf').hidden = true; }
  if (e.key === 'Enter' && e.target.classList?.contains('sinput')) e.target.blur();
});
window.addEventListener('hashchange', () => { S.prevHash = S.curHash; S.curHash = location.hash; render(); window.scrollTo(0, 0); });
window.addEventListener('online', () => { updateSync(); flush(); });
window.addEventListener('offline', updateSync);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { updateWakeLock(); tick(); flush(); if (S.user) fetchAll(); }
  else updateWakeLock();
});
setInterval(tick, 250);
setInterval(() => { if (S.queue.length) flush(); }, 20000);

/* ---------- boot ---------- */
(function boot() {
  if (!configured || !window.supabase) {
    render();
    if (configured && !window.supabase) $('#app').innerHTML = '<div class="empty" style="padding-top:30vh">טעינת הספרייה נכשלה. בדוק חיבור לאינטרנט ורענן.</div>';
    return;
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'koach-auth' }
  });
  sb.auth.onAuthStateChange((event, session) => {
    const u = session?.user || null;
    if (u && (!S.user || S.user.id !== u.id)) {
      S.user = u; loadCache(); render();
      setTimeout(() => { flush(); fetchAll(); }, 0);
    } else if (!u && S.user) {
      S.user = null; resetState(); render();
    } else if (!u) {
      render();
    }
  });
})();
</script>
